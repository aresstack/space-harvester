// section plan, sequential writing with the writing memory, sentence check, mission report.

dependencies {
    api "com.aresstack:knowledge4j-knowledge-api:${rootProject.knowledge4jVersion}"
    api "com.aresstack:knowledge4j-knowledge-model:${rootProject.knowledge4jVersion}"
    implementation "com.aresstack:knowledge4j-knowledge-file-support:${rootProject.knowledge4jVersion}"
    implementation "com.google.code.gson:gson:${rootProject.gsonVersion}"
}

dependencies {
    // The test fixtures of knowledge-model (FakeModelPort); their capability carries the project name.
    testImplementation("com.aresstack:knowledge4j-knowledge-model:${rootProject.knowledge4jVersion}") {
        capabilities { requireCapability('com.aresstack:knowledge-model-test-fixtures') }
    }
}
