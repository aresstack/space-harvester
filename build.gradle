// Gradle-Wurzel: nur Aggregator. Der Dienst liegt in space-harvester-server, die Upstream-Kopie in
// enterprise-ai-sources; Zuordnung und Gründe stehen in docs/MODULES.md (#100).
plugins {
    id 'base'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

allprojects {
    group = 'com.aresstack.spaceharvester'
    // Gemeinsame Release-Version aller Module (Workflow Release: -PreleaseVersion=0.1.0-beta.3); sonst SNAPSHOT
    version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0-SNAPSHOT')

    // drawio-java braucht Batik 1.20, mermaid-java bringt 1.17 mit: eine Batik-Linie im Klassenpfad.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.xmlgraphics' && details.requested.name.startsWith('batik-')) {
                details.useVersion '1.20'
                details.because 'drawio-java needs Batik 1.20; keep one Batik line on the classpath'
            }
        }
    }
}

// Bibliotheken aus eigenen Repositories (Knowledge4j, Research4j, Writing4j) liegen als unveränderte Kopie unter libs/
// und werden per Composite Build eingebunden (settings.gradle, libs/README.md). Die Kopien dürfen hier nicht geändert
// werden: check prüft jede gegen ihr Manifest libs/upstream/<bibliothek>.sha256.
apply from: "$rootDir/gradle/upstream-copy.gradle"
gradle.aresstackLibraries.keySet().each { library ->
    def copyDir = file("libs/$library")
    registerUpstreamCopyCheck(name: "libs/$library", taskName: "verify${library.capitalize()}Copy",
            manifest: file("libs/upstream/${library}.sha256"), baseDir: copyDir,
            files: fileTree(copyDir) { exclude '**/build/**', '**/.gradle/**' },
            normalizeLineEndings: true,
            hint: "Änderungen gehören in aresstack/$library und kommen per libs/sync-from-upstream.sh zurück")
}

// Die Bibliotheksliste von Einstellungen › Bibliotheken (oss-licenses.json in den Ressourcen der Desktop-App).
ext.ossLicenseTargetProjectPath = ':space-harvester-app'
apply from: "$rootDir/gradle/oss-licenses.gradle"

// Bundle für das Central Publisher Portal (Workflow maven-central.yml, nur manuell): der Core und die drei Module,
// die seine POM nennt, je mit POM, JAR, Sources, Javadoc, Signaturen (.asc) und Prüfsummen. maven-metadata.xml gehört
// nicht ins Bundle; ältere Versionen aus build/repo auch nicht.
def centralModules = [':enterprise-ai-sources', ':document-export', ':nlp-lexicon', ':space-harvester-core']
tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Packt das Maven-Central-Bundle von Core, enterprise-ai-sources, document-export und nlp-lexicon.'
    dependsOn centralModules.collect { "${it}:publishMavenPublicationToLocalRepository" }
    def releaseVersion = version.toString()
    centralModules.each { path ->
        from(project(path).layout.buildDirectory.dir('repo')) {
            include "**/${releaseVersion}/**"
        }
    }
    archiveFileName = "central-bundle-${releaseVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
    doFirst {
        if (releaseVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException('Maven Central nimmt keine SNAPSHOT-Versionen an (-PreleaseVersion=<v> setzen)')
        }
    }
}
