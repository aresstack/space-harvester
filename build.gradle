plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.aresstack.spaceharvester'
version = '0.1.0-SNAPSHOT'
description = 'Space Harvester – erntet Wissensquellen (zunächst Confluence Data Center) und exportiert sie maschinenlesbar.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation libs.springdoc.openapi.webmvc.ui
    // Azure Key Vault als optionale PropertySource (#22); ohne Aktivierung kein Azure-Kontakt, siehe docs/SECRETS.md
    implementation platform(libs.spring.cloud.azure.dependencies)
    implementation 'com.azure.spring:spring-cloud-azure-starter-keyvault-secrets'
    // Confluence-Quelle aus enterprise-ai-client (Kopie, siehe enterprise-ai-sources/UPSTREAM.md)
    implementation project(':enterprise-ai-sources')
    // Proxy-Route je Ziel-URL: PAC per PowerShell/Windows-Einstellungen/fester Adresse, GraalJS-Auswertung (#34)
    implementation libs.win.proxy.java
    // Asynchroner Confluence-Transport (#47, ADR 0001): WebClient auf Reactor Netty nur als Client, MVC bleibt
    implementation 'org.springframework:spring-webflux'
    implementation 'io.projectreactor.netty:reactor-netty-http'
    // Seiten-Cache und Index, nur im Paket persistence (#26)
    implementation libs.lucene.core

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.archunit.junit5
    testImplementation testFixtures(project(':enterprise-ai-sources'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Vertragstest ConfluenceAsyncHttpTransportContract aus der Kopie ist JUnit 4
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

springBoot {
    // Liefert build.version/build.time für /actuator/info und die Service-Info unter /api/v1.
    buildInfo {
        excludes = ['time']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// Reproduzierbare Archive: gleiche Quellen ergeben byte-gleiche Jars.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnitPlatform()
    // Testnamen *.test zeigen auf Loopback, damit Proxy-Tests eine mögliche Direktverbindung erkennen (#34).
    systemProperty 'jdk.net.hosts.file', file('src/test/resources/test-hosts').absolutePath
}

// Das einfache (nicht ausführbare) Jar wird nicht gebraucht; bootJar ist das Artefakt.
tasks.named('jar') {
    enabled = false
}

// Wertet ein PAC-Skript im ausführbaren Spring-Boot-JAR aus (#34): GraalJS (js und regex) muss in den
// verschachtelten JARs tatsächlich laufen, nicht nur im Test-Klassenpfad.
abstract class BootJarPacCheck extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJar()

    @InputFile
    abstract RegularFileProperty getPac()

    @Nested
    abstract Property<JavaLauncher> getLauncher()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void check() {
        def output = new ByteArrayOutputStream()
        def result = execOperations.exec {
            commandLine launcher.get().executablePath.asFile.absolutePath,
                    '-Dloader.main=com.aresstack.spaceharvester.source.network.ProxyDiagnosticsMain',
                    '-cp', jar.get().asFile.absolutePath,
                    'org.springframework.boot.loader.launch.PropertiesLauncher',
                    '--mode=pac-url-manual', "--pac-url=${pac.get().asFile.toURI()}",
                    'https://confluence.sentinel.test/rest/api/space', 'https://other.example/'
            standardOutput = output
            errorOutput = output
            ignoreExitValue = true
        }
        def text = output.toString('UTF-8')
        if (result.exitValue != 0 || !text.contains('Result: PROXY 192.0.2.123:18080')
                || !text.contains('Result: DIRECT')) {
            throw new GradleException("PAC-Auswertung im ausführbaren JAR fehlgeschlagen (Exit ${result.exitValue}):\n${text}")
        }
        logger.lifecycle(text.readLines().findAll { it.startsWith('Result:') }.join('\n'))
        fetchAsync()
    }

    /** Der asynchrone Transport (WebClient, Reactor Netty, #47) ruft aus dem JAR einen lokalen Server ab. */
    private void fetchAsync() {
        def server = com.sun.net.httpserver.HttpServer.create(
                new InetSocketAddress(InetAddress.getLoopbackAddress(), 0), 0)
        server.createContext('/') { exchange ->
            byte[] body = '{"results":[]}'.getBytes('UTF-8')
            exchange.responseHeaders.add('Content-Type', 'application/json')
            exchange.sendResponseHeaders(200, body.length)
            exchange.responseBody.withCloseable { it.write(body) }
        }
        server.start()
        try {
            def output = new ByteArrayOutputStream()
            def result = execOperations.exec {
                commandLine launcher.get().executablePath.asFile.absolutePath,
                        '-Dloader.main=com.aresstack.spaceharvester.source.network.ProxyDiagnosticsMain',
                        '-cp', jar.get().asFile.absolutePath,
                        'org.springframework.boot.loader.launch.PropertiesLauncher',
                        '--mode=pac-url-manual', "--pac-url=${pac.get().asFile.toURI()}", '--fetch=async',
                        "http://127.0.0.1:${server.address.port}/rest/api/space"
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            def text = output.toString('UTF-8')
            if (result.exitValue != 0 || !text.contains(': HTTP 200, 14 Bytes')) {
                throw new GradleException("Asynchroner Abruf im ausführbaren JAR fehlgeschlagen (Exit ${result.exitValue}):\n${text}")
            }
            logger.lifecycle(text.readLines().findAll { it.startsWith('Fetch ') }.join('\n'))
        } finally {
            server.stop(0)
        }
    }
}

def bootJarPacCheck = tasks.register('bootJarPacCheck', BootJarPacCheck) {
    group = 'verification'
    description = 'Wertet ein PAC-Skript mit GraalJS im ausführbaren JAR aus und ruft asynchron einen lokalen Server ab.'
    jar = tasks.named('bootJar').flatMap { it.archiveFile }
    pac = layout.projectDirectory.file('src/test/resources/sentinel.pac')
    launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn bootJarPacCheck
}

// Fake-Confluence mit den Demo-Daten für docs/E2E.md auf http://127.0.0.1:8090 (#15); nur Testdaten.
tasks.register('demoConfluence', JavaExec) {
    group = 'application'
    description = 'Startet die Demo-Fake-Confluence für die dokumentierten Beispiele (docs/E2E.md).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aresstack.spaceharvester.demo.DemoConfluence'
    jvmArgs '-Dstdout.encoding=UTF-8'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
