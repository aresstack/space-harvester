spring:
  application:
    name: space-harvester
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # Azure Key Vault nur über das Profil azure-keyvault (#22, docs/SECRETS.md); ohne es kein Kontakt zu Azure.
  cloud:
    azure:
      keyvault:
        secret:
          property-source-enabled: false
    # Spring Cloud Config Server nur über spring.config.import bzw. Profil config-server (#3, docs/CONFIGURATION.md).
    config:
      import-check:
        enabled: false

server:
  port: ${SPACE_HARVESTER_PORT:8080}
  shutdown: graceful
  # Keine Route nimmt einen Formular- oder großen Body an; kleine Grenzen gegen Ressourcenverbrauch (Durchsicht, docs/SECURITY.md).
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

# Wissensquellen. Ohne Eintrag startet der Dienst ohne Quellen. Beispiel und Anmeldearten: README.md.
space-harvester:
  sources: []
  # Proxy-Route je Ziel-URL für alle Quellen (#34). disabled = direkt; PAC/WPAD und weitere Modi: README.md.
  network:
    proxy:
      mode: disabled
    # disabled = alles synchron; web-client = Seiten-Snapshots zusätzlich nicht blockierend (#47, ADR 0001).
    async-transport: disabled
  # Optionale Weboberfläche unter /ui/ (#17); spricht nur die REST-API mit Bearer-Token an.
  ui:
    enabled: true
  # Zugriffsschutz der API: Standard mode=clients ohne Clients, also kein Datenzugriff. Siehe docs/SECURITY.md.
  security:
    mode: clients
    clients: []

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

---
# Strukturierte JSON-Logs (Elastic Common Schema), z. B. für Container-Betrieb:
#   SPRING_PROFILES_ACTIVE=json-logs
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
