spring:
  application:
    name: space-harvester
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SPACE_HARVESTER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true

# Wissensquellen. Ohne Eintrag startet der Dienst ohne Quellen. Beispiel und Anmeldearten: README.md.
space-harvester:
  sources: []
  # Zugriffsschutz der API: Standard mode=clients ohne Clients, also kein Datenzugriff. Siehe docs/SECURITY.md.
  security:
    mode: clients
    clients: []
  # Proxy-Route je Ziel-URL für alle Quellen (#34). disabled = direkt; PAC/WPAD und weitere Modi: README.md.
  network:
    proxy:
      mode: disabled

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

---
# Strukturierte JSON-Logs (Elastic Common Schema), z. B. für Container-Betrieb:
#   SPRING_PROFILES_ACTIVE=json-logs
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
