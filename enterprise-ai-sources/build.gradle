// Unveränderte Kopie der Confluence- und der Dateiquelle und ihrer Basismodule aus aresstack/enterprise-ai-client
// (astu-Auszug, adyton, network, source-api, source-confluence, deigma, source-localfiles, source-mediawiki, embedding-api,
// embedding-openai, Modellkatalog aus model-api/model-kipitz, document-tika). Herkunft und Abgleich: UPSTREAM.md.
// Der Code ist Java-8-kompatibel; er wird hier mit Java 21 gebaut, seine JUnit-4-Tests laufen mit.
plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'Confluence-Quelle und Knowledge-Source-Port aus enterprise-ai-client (Kopie).'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation libs.gson
    implementation libs.jsoup
    // draw.io-Diagramme als SVG (DrawioDiagramRenderer)
    implementation libs.jgraphx
    // Dokument-Extraktion (document-tika, #183) wie im Upstream: tika-core plus Standard-Parser (PDFBox, POI, ...),
    // flexmark ausgeschlossen wie in MainframeMate und im Upstream (Tika zieht eine neuere Linie als document-export).
    implementation libs.tika.core
    implementation(libs.tika.parsers.standard) {
        exclude group: 'com.vladsch.flexmark'
    }

    // FakeConfluence/FakeConfluenceServer und KnowledgeSourceContractTest (JUnit 4)
    testFixturesImplementation libs.gson
    testFixturesApi libs.junit4

    testImplementation libs.junit4
    // Tests des OpenAI-kompatiblen Embedding-Adapters lesen JSON mit Gson
    testImplementation libs.gson
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnit()
    systemProperty 'java.awt.headless', 'true'
}

// Lokale Änderungen an der Kopie erkennen: Jede Datei unter src/ und LICENSE muss exakt der Prüfsumme
// aus UPSTREAM.sha256 entsprechen (geschrieben von sync-from-upstream.sh); fehlende oder zusätzliche
// Dateien zählen ebenfalls als Abweichung. Läuft offline als Teil von check/build.
def verifyUpstreamCopy = tasks.register('verifyUpstreamCopy') {
    group = 'verification'
    description = 'Prüft, dass enterprise-ai-sources unverändert dem Upstream-Stand aus UPSTREAM.sha256 entspricht.'
    def manifestFile = layout.projectDirectory.file('UPSTREAM.sha256')
    def copied = layout.projectDirectory.dir('src')
    def license = layout.projectDirectory.file('LICENSE')
    inputs.file(manifestFile)
    inputs.dir(copied)
    inputs.file(license)
    def marker = layout.buildDirectory.file('verifyUpstreamCopy/ok')
    outputs.file(marker)
    doLast {
        def root = layout.projectDirectory.asFile.toPath()
        def expected = [:] as TreeMap
        manifestFile.asFile.eachLine { line ->
            if (!line.startsWith('#') && !line.isBlank()) {
                def parts = line.split('  ', 2)
                expected[parts[1]] = parts[0]
            }
        }
        def actual = [:] as TreeMap
        def files = [license.asFile] + project.fileTree(copied).files
        files.each { file ->
            def path = root.relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            actual[path] = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
        }
        def problems = []
        (expected.keySet() - actual.keySet()).each { problems << "fehlt: $it" }
        (actual.keySet() - expected.keySet()).each { problems << "zusätzlich: $it" }
        expected.each { path, hash -> if (actual.containsKey(path) && actual[path] != hash) problems << "geändert: $path" }
        if (problems) {
            throw new GradleException("enterprise-ai-sources weicht vom Upstream-Stand ab. Änderungen gehören in " +
                    "aresstack/enterprise-ai-client und kommen per sync-from-upstream.sh zurück:\n  " + problems.join('\n  '))
        }
        def out = marker.get().asFile
        out.parentFile.mkdirs()
        out.text = "${actual.size()} Dateien geprüft\n"
    }
}

tasks.named('check') {
    dependsOn verifyUpstreamCopy
}

// Veröffentlichung vorbereitet, weil space-harvester-core die Kopie braucht (#100, docs/MODULES.md); der Code bleibt
// unverändert, nur diese Build-Datei gehört dem Harvester.
ext.publishedArtifactId = 'space-harvester-enterprise-ai-sources'
apply from: rootProject.file('gradle/publishing.gradle')
