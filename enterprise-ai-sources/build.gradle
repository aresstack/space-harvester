// Unveränderte Kopie der Confluence- und der Dateiquelle und ihrer Basismodule aus aresstack/enterprise-ai-client
// (astu-Auszug, adyton, network, source-api, source-confluence, deigma, source-localfiles, source-mediawiki,
// source-git, source-ftp, source-ndv, source-sharepoint, source-betaview, source-outlook, source-jira, embedding-api,
// embedding-openai, Modellkatalog aus model-api/model-kipitz, document-tika). Herkunft und Abgleich: UPSTREAM.md.
// Der Code ist Java-8-kompatibel; er wird hier mit Java 21 gebaut, seine JUnit-4-Tests laufen mit.
plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'Confluence-Quelle und Knowledge-Source-Port aus enterprise-ai-client (Kopie).'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation libs.gson
    implementation libs.jsoup
    // draw.io-Diagramme als SVG (DrawioDiagramRenderer über drawio-java)
    implementation libs.drawio.java
    // Die Upstream-Tests zeichnen auch XML-Schablonen (BPMN-Tasks); ausgeliefert werden sie von App und Dienst
    testRuntimeOnly libs.drawio.stencils
    // Git-Quelle (source-git, #187): JGit nur adapterintern und nur lesend, dieselbe Version wie im Upstream
    implementation libs.jgit
    // FTP/JES-Quelle (source-ftp, #187): Apache Commons Net nur adapterintern, wie im Upstream
    implementation libs.commons.net
    // Outlook-Quelle (source-outlook, #187): java-libpst nur adapterintern, wie im Upstream
    implementation libs.java.libpst
    // Dokument-Extraktion (document-tika, #183) wie im Upstream: tika-core plus Standard-Parser (PDFBox, POI, ...),
    // flexmark ausgeschlossen wie in MainframeMate und im Upstream (Tika zieht eine neuere Linie als document-export).
    implementation libs.tika.core
    implementation(libs.tika.parsers.standard) {
        exclude group: 'com.vladsch.flexmark'
    }

    // FakeConfluence/FakeConfluenceServer und KnowledgeSourceContractTest (JUnit 4)
    testFixturesImplementation libs.gson
    testFixturesApi libs.junit4

    testImplementation libs.junit4
    // Tests des OpenAI-kompatiblen Embedding-Adapters lesen JSON mit Gson
    testImplementation libs.gson
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnit()
    systemProperty 'java.awt.headless', 'true'
}

// Lokale Änderungen an der Kopie erkennen (gemeinsame Prüfung in gradle/upstream-copy.gradle).
apply from: rootProject.file('gradle/upstream-copy.gradle')
def verifyUpstreamCopy = registerUpstreamCopyCheck(name: 'enterprise-ai-sources',
        manifest: file('UPSTREAM.sha256'),
        baseDir: projectDir,
        files: files('LICENSE', fileTree('src')),
        upstream: 'aresstack/enterprise-ai-client')

// Veröffentlichung vorbereitet, weil space-harvester-core die Kopie braucht (#100, docs/MODULES.md); der Code bleibt
// unverändert, nur diese Build-Datei gehört dem Harvester.
ext.publishedArtifactId = 'space-harvester-enterprise-ai-sources'
apply from: rootProject.file('gradle/publishing.gradle')
