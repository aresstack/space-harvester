<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Harvester</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>Space Harvester</h1>
  <form id="login" autocomplete="off">
    <label for="token">Bearer-Token</label>
    <input id="token" type="password" required placeholder="Token des technischen Clients">
    <button type="submit">Anmelden</button>
  </form>
  <button id="logout" type="button" hidden>Abmelden</button>
</header>
<main>
  <p id="message" role="alert" hidden></p>
  <section id="sources-section" hidden>
    <h2>Quellen und Spaces</h2>
    <label for="source">Quelle</label>
    <select id="source"></select>
    <table id="spaces">
      <thead><tr><th>Space</th><th>Name</th><th>Aktionen</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section id="jobs-section" hidden>
    <h2>Aufträge</h2>
    <table id="jobs">
      <thead><tr><th>Art</th><th>Space</th><th>Zustand</th><th>Fortschritt</th><th>Ergebnis</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
</body>
</html>
