// Unveränderte Kopie des chatgebundenen Browsers aus aresstack/enterprise-ai-client (#141 dort): browser-api (Port),
// browser-runtime (Profil je Chat, Start, Wiederverbinden) und browser-firefox (sichtbares Firefox über WebDriver BiDi,
// mit dem vendorten WD4J aus MainframeMate unter de.bund.zrb). Nur die Desktop-App nutzt sie für die Websuche im
// Chat. Herkunft und Abgleich: UPSTREAM.md.
plugins {
    id 'java-library'
}

description = 'Chatgebundener Browser (Firefox, WebDriver BiDi) aus enterprise-ai-client (Kopie), nur für die Desktop-App.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // WD4J (vendort): WebSocket, JSON und Wrapper-Suche, wie im Upstream-Build von browser-firefox.
    implementation libs.java.websocket
    implementation libs.gson
    implementation libs.reflections

    testImplementation libs.junit4
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Die vendorten WD4J-Quellen bleiben wie im Upstream; ihre Lint-Warnungen behebt man nicht hier.
    options.compilerArgs.removeAll { it.startsWith('-Xlint') }
    options.compilerArgs.add('-Xlint:none')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnit()
    systemProperty 'java.awt.headless', 'true'
    // Echttest mit zwei Firefox-Instanzen (TwoFirefoxChatsIT) nur auf Wunsch, wie im Upstream.
    ['enterpriseai.firefox.it', 'enterpriseai.firefox'].each { name ->
        if (System.getProperty(name) != null) {
            systemProperty name, System.getProperty(name)
        }
    }
}

// Lokale Änderungen an der Kopie erkennen: Jede Datei unter src/ und LICENSE muss exakt der Prüfsumme
// aus UPSTREAM.sha256 entsprechen (geschrieben von sync-from-upstream.sh); fehlende oder zusätzliche
// Dateien zählen ebenfalls als Abweichung. Läuft offline als Teil von check/build.
def verifyUpstreamCopy = tasks.register('verifyUpstreamCopy') {
    group = 'verification'
    description = 'Prüft, dass enterprise-ai-browser unverändert dem Upstream-Stand aus UPSTREAM.sha256 entspricht.'
    def manifestFile = layout.projectDirectory.file('UPSTREAM.sha256')
    def copied = layout.projectDirectory.dir('src')
    def license = layout.projectDirectory.file('LICENSE')
    inputs.file(manifestFile)
    inputs.dir(copied)
    inputs.file(license)
    def marker = layout.buildDirectory.file('verifyUpstreamCopy/ok')
    outputs.file(marker)
    doLast {
        def root = layout.projectDirectory.asFile.toPath()
        def expected = [:] as TreeMap
        manifestFile.asFile.eachLine { line ->
            if (!line.startsWith('#') && !line.isBlank()) {
                def parts = line.split('  ', 2)
                expected[parts[1]] = parts[0]
            }
        }
        def actual = [:] as TreeMap
        def files = [license.asFile] + project.fileTree(copied).files
        files.each { file ->
            def path = root.relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            actual[path] = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
        }
        def problems = []
        (expected.keySet() - actual.keySet()).each { problems << "fehlt: $it" }
        (actual.keySet() - expected.keySet()).each { problems << "zusätzlich: $it" }
        expected.each { path, hash -> if (actual.containsKey(path) && actual[path] != hash) problems << "geändert: $path" }
        if (problems) {
            throw new GradleException("enterprise-ai-browser weicht vom Upstream-Stand ab. Änderungen gehören in " +
                    "aresstack/enterprise-ai-client und kommen per sync-from-upstream.sh zurück:\n  " + problems.join('\n  '))
        }
        def out = marker.get().asFile
        out.parentFile.mkdirs()
        out.text = "${actual.size()} Dateien geprüft\n"
    }
}

tasks.named('check') {
    dependsOn verifyUpstreamCopy
}
