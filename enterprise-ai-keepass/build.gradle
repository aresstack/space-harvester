// Unveränderte Kopie der KeePassRPC-Anbindung (proasteion/platform/security-keepassrpc) aus
// aresstack/enterprise-ai-client: Kopplung (SRP-Pairing), Einträge lesen und anlegen. Nur die Desktop-App nutzt sie;
// der Core kennt KeePass nicht. Herkunft und Abgleich: UPSTREAM.md.
plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

description = 'KeePassRPC-Anbindung aus enterprise-ai-client (Kopie), nur für die Desktop-App.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // adyton (SecretProvider, SecretVault) und astu SecretRef liegen bereits in der Kopie enterprise-ai-sources
    api project(':enterprise-ai-sources')
    implementation libs.java.websocket
    implementation libs.gson
    testFixturesImplementation libs.java.websocket
    testFixturesImplementation libs.gson

    testImplementation libs.junit4
    testImplementation libs.gson
    testImplementation libs.java.websocket
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnit()
    systemProperty 'java.awt.headless', 'true'
}

// Lokale Änderungen an der Kopie erkennen (gemeinsame Prüfung in gradle/upstream-copy.gradle).
apply from: rootProject.file('gradle/upstream-copy.gradle')
def verifyUpstreamCopy = registerUpstreamCopyCheck(name: 'enterprise-ai-keepass',
        manifest: file('UPSTREAM.sha256'),
        baseDir: projectDir,
        files: files('LICENSE', fileTree('src')),
        upstream: 'aresstack/enterprise-ai-client')
