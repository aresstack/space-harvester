pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        // Unreleased win-directml-java builds (publishToMavenLocal), only when explicitly enabled.
        if (providers.gradleProperty('aresstackMavenLocal').getOrElse('false').toBoolean()) {
            mavenLocal {
                content {
                    includeGroup 'com.aresstack'
                }
            }
        }
    }
}

rootProject.name = 'space-harvester'

// Unveränderte Kopie der Confluence-Quelle aus aresstack/enterprise-ai-client, siehe enterprise-ai-sources/UPSTREAM.md.
include 'enterprise-ai-sources'

include 'enterprise-ai-keepass'

// Dokumentausgabe des Enterprise AI Client (Word, PDF, Markdown) als eigene Bibliothek ohne Swing (angepasste Kopie,
// siehe document-export/UPSTREAM.md).
include 'document-export'

// Bibliothek mit der Fachlogik, ohne Spring Boot und REST, siehe docs/MODULES.md (#100).
include 'space-harvester-core'

// Ausführbarer Spring-Boot-Dienst (REST, Fassade, UI), siehe docs/MODULES.md (#100).
include 'space-harvester-server'

// Deutsches Dependency Parsing nach Universal Dependencies (#98, ADR 0005): Laufzeitmodul mit MaltParser und
// objektzentrierter Auswertung. Der Dienst bindet es (noch) nicht ein; das Modell kommt aus #99.
include 'nlp-parser'

// Gemeinsame deutsche Wortlisten (Verneinung, Modalverben) ohne Abhängigkeiten, für Parser und Core (ADR 0035, O4).
include 'nlp-lexicon'

// Eigenständige Trainingswerkzeuge für das deutsche MaltParser-Modell (#99); weder Anwendung noch Parser hängen davon ab.
include 'nlp-model-training'

// Unveränderte Kopie der Comic-Bedienelemente aus aresstack/enterprise-ai-client, siehe comic-controls/UPSTREAM.md.
include 'comic-controls'

// Eigenständige Swing-Desktop-App auf der Core-Bibliothek, ohne REST und ohne Spring-Kontext (#103).
// Command Deck (#1142): interaktive Host-Sitzungen (TN3270), nur für die Desktop-App.
include 'command-deck'
// Parser und Hervorhebung für JCL, COBOL und Natural aus MainframeMate (Gliederung, TokenMaker), eigenes Modul (#1142)
include 'mainframe-languages'
include 'proleap-parser'
// Diagramm-Ansicht „Visuell“ im Command Deck: Mermaid-Renderer aus MainframeMate (GraalJS, Batik), nur für die Desktop-App
include 'mermaid-renderer'
include 'space-harvester-app'

// Vergleichstests gegen den Enterprise AI Client (ADR 0012, docs/PARITY.md, #193): neutrales Dokumentmodell für
// DOCX, PDF und Markdown, ParityReport für den Live-Lauf; hängt nur am Core, nichts hängt davon ab.
include 'parity-tests'

// Knowledge4j, Research4j und Writing4j: Maven Central nimmt keine neuen com.aresstack-Releases mehr an (Kontingent des
// Namespace erschöpft, 27.11.2026). Der Space Harvester baut sie deshalb selbst, als eigene Gradle-Projekte per Composite
// Build aus unveränderten Kopien unter libs/ (libs/README.md, Abgleich per libs/sync-from-upstream.sh). Die Koordinaten
// in gradle/libs.versions.toml bleiben, Gradle ersetzt sie durch die Projekte. Wer an einer Bibliothek mitentwickelt,
// nennt mit -Paresstack.libs=<ordner> (oder aresstack.libs=<ordner> in der eigenen gradle.properties) den Ordner mit den
// eigenen Klonen; dann gelten diese statt der Kopien.
def aresstackLibs = file(providers.gradleProperty('aresstack.libs').getOrElse("$rootDir/libs"))
[
        knowledge4j: [prefix: 'knowledge4j-', projects: ['knowledge-api', 'knowledge-model', 'knowledge-model-support',
                                                          'knowledge-file-support']],
        research4j : [prefix: 'research4j-', projects: ['browser-api', 'browser-tools', 'browser-playwright',
                                                         'browser-search-analysis', 'browser-static-http',
                                                         'web-search-providers', 'serp4j-playwright-google',
                                                         'research-domain', 'research-agent-runtime',
                                                         'agent-model-runtime-api', 'mcp-runtime-api', 'research-core']],
        writing4j  : [prefix: 'writing4j-', projects: ['writing-core'], artifact: { it.replace('writing-', '') }],
].each { library, spec ->
    includeBuild(new File(aresstackLibs, library)) {
        dependencySubstitution {
            spec.projects.each { name ->
                def artifact = spec.artifact ? spec.artifact(name) : name
                substitute module("com.aresstack:${spec.prefix}${artifact}") using project(":${name}")
            }
        }
    }
}
