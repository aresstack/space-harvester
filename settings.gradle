pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'space-harvester'

// Unveränderte Kopie der Confluence-Quelle aus aresstack/enterprise-ai-client, siehe enterprise-ai-sources/UPSTREAM.md.
include 'enterprise-ai-sources'

include 'enterprise-ai-keepass'

// Dokumentausgabe des Enterprise AI Client (Word, PDF, Markdown) als eigene Bibliothek ohne Swing (angepasste Kopie,
// siehe document-export/UPSTREAM.md).
include 'document-export'

// Bibliothek mit der Fachlogik, ohne Spring Boot und REST, siehe docs/MODULES.md (#100).
include 'space-harvester-core'

// Ausführbarer Spring-Boot-Dienst (REST, Fassade, UI), siehe docs/MODULES.md (#100).
include 'space-harvester-server'

// Deutsches Dependency Parsing nach Universal Dependencies (#98, ADR 0005): Laufzeitmodul mit MaltParser und
// objektzentrierter Auswertung. Der Dienst bindet es (noch) nicht ein; das Modell kommt aus #99.
include 'nlp-parser'

// Eigenständige Trainingswerkzeuge für das deutsche MaltParser-Modell (#99); weder Anwendung noch Parser hängen davon ab.
include 'nlp-model-training'

// Unveränderte Kopie der Comic-Bedienelemente aus aresstack/enterprise-ai-client, siehe comic-controls/UPSTREAM.md.
include 'comic-controls'

// Eigenständige Swing-Desktop-App auf der Core-Bibliothek, ohne REST und ohne Spring-Kontext (#103).
include 'space-harvester-app'

// Vergleichstests gegen den Enterprise AI Client (ADR 0012, docs/PARITY.md, #193): neutrales Dokumentmodell für
// DOCX, PDF und Markdown, ParityReport für den Live-Lauf; hängt nur am Core, nichts hängt davon ab.
include 'parity-tests'
