# Speicher des Gradle-Daemons: die Vorgabe (512 MiB) reicht für das parallele Kompilieren von core- und app-Tests
# nicht mehr (Release 28.11. 19:05 MEZ: GC-Thrashing). Gleiche Werte wie der Offline-ZIP-Workflow.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

org.gradle.caching=true
org.gradle.parallel=true

# TEMPORARY: directml-inference/directml-whisper-audio 0.3.2 are only in Maven Local until the
# Maven Central release. Remove this line (and keep mavenCentral only) once 0.3.2 is published.
aresstackMavenLocal=true
