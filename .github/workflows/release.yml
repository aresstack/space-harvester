name: Release

# Gemeinsames Release von Space Harvester: baut und testet alle Module (./gradlew build) und stellt drei Artefakte
# derselben Version aus demselben Commit bereit, dazu SHA256SUMS und Build-Provenance-Attestierung:
# - space-harvester-app-<v>.jar     Desktop-App (:space-harvester-app, ausführbar)
# - space-harvester-<v>.jar         REST-Service (:space-harvester-server, ausführbares Spring-Boot-JAR)
# - space-harvester-core-<v>.jar    Bibliothek (:space-harvester-core, normales JAR) mit -sources.jar und -javadoc.jar
# Die Version kommt zentral über -PreleaseVersion (build.gradle). Auslöser:
# - Push auf main: das EINE rollierende Release „Space Harvester – current build“ mit dem festen Tag „latest“ bekommt
#   diesen Stand, als „Latest“ markiert, ohne Versionsnummer im Titel und in den Dateinamen. So liefert
#   https://github.com/aresstack/space-harvester/releases/download/latest/space-harvester-app.jar immer den neuesten
#   Stand (Lesezeichen, Vorbild aresstack/audio). Intern trägt das JAR <Basis>-beta.<N> für --version.
# - Push auf develop (Angelo 22.11.: andere Branches bauen kein Release, PR-Checks laufen über build.yml): das rollierende Pre-Release „snapshot“ bekommt diesen Stand, ebenfalls ohne
#   Versionsnummer in Titel und Dateinamen, nie „Latest“. Das ist das einzige Pre-Release.
# - Tag v<Major>.<Minor>.<Patch>[-<Vorabkennung>] auf einem main-Stand oder manueller Start auf main mit Eingabe
#   „tag“: Release genau mit dieser Version und Versionsnummern in den Dateinamen. Immer das NEUESTE Release ist
#   „Latest“ (Angelo 16.11.): das getaggte, bis der nächste main-Lauf „latest“ wieder dazu macht. Ohne Vorabkennung
#   braucht es docs/release-notes/<tag>.md.
# Maven Central gehört nicht hierher: eigener, nur manuell gestarteter Workflow maven-central.yml.
# Versionierte Releases werden nie überschrieben. Ablauf: docs/DESKTOP_APP.md („Releases“).
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag auf dem gewählten main-Stand, z. B. v0.1.0; leer: wie ein Push auf den gewählten Branch'
        type: string
        required: false

permissions:
  contents: read

# Drei Gruppen für den Bau (Job app): andere Branches teilen sich das Snapshot-Release, main ohne Tag (Push oder manuell
# ohne Tag) das rollierende „latest“, Tags und manuell angelegte Releases laufen nacheinander. Bei Snapshot und latest
# bricht ein neuer Lauf den laufenden Bau ab, damit nur der neueste Stand gebaut wird (Angelo 22.11.). Das Veröffentlichen
# der rollierenden Releases ist ein eigener Job, der nie abgebrochen wird und je Release nacheinander läuft, damit kein
# Abbruch ein halb ersetztes Release hinterlässt. Getaggte Releases werden nie abgebrochen.

env:
  # Rollierend ohne Versionsnummer: main aktualisiert das Release „latest“, andere Branches das Pre-Release „snapshot“.
  BETA_TAG: latest
  SNAPSHOT_TAG: snapshot
  # Frühere Releases, die der main-Lauf entfernt (nur die Releases; Git-Tags bleiben, außer beim alten „beta“).
  # Der ZIP-Build (chatgpt-compatible-release.yml) hängt sein ZIP jetzt an „latest“.
  OBSOLETE_RELEASES: beta chatgpt-compatible v0.1.0-alpha.1
  # Dateien an „latest“, die nicht aus diesem Workflow stammen und beim Aufräumen bleiben
  FOREIGN_ASSETS: space-harvester-chatgpt-compatible.zip

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: release-${{ (github.ref_type == 'branch' && github.ref != 'refs/heads/main') && 'snapshot' || ((github.ref == 'refs/heads/main' && (inputs.tag == '' || inputs.tag == null)) && 'latest' || 'versioned') }}
      # develop (Angelo 23.11.): nie abbrechen, sonst wird bei vielen Merges kein Snapshot fertig. Der laufende Bau
      # endet, danach folgt nur der neueste wartende Stand (GitHub hält je Gruppe höchstens einen wartenden Lauf).
      cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != 'refs/heads/develop' && (github.ref != 'refs/heads/main' || inputs.tag == '' || inputs.tag == null) }}
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.promote.outputs.version || steps.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Artefakte des develop-Laufs herunterladen (Schritt „Geprüften develop-Stand übernehmen“)
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bestimmen
        id: version
        run: |
          base=$(sed -n "s/.*gradleProperty('releaseVersion').getOrElse('\(.*\)').*/\1/p" build.gradle)
          base="${base%-SNAPSHOT}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Basisversion $base aus build.gradle unbrauchbar"; exit 1; }
          # Betas und Snapshots laufen auf der nächsten Patch-Version nach dem neuesten regulären Release (nach v0.1.1:
          # 0.1.2-beta.N), damit sie nach dem Versionsschema nie unter dem Release einsortiert werden
          stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          if [ -n "$stable" ] && [ "$(printf '%s\n%s\n' "$base" "$stable" | sort -V | tail -1)" = "$stable" ]; then
            IFS=. read -r major minor patch <<< "$stable"
            base="$major.$minor.$((patch + 1))"
          fi
          tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            mode=tag; tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release-Tags nur von main aus anlegen"; exit 1; }
            mode=new-tag; tag="$INPUT_TAG"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            mode=beta
          else
            mode=snapshot
          fi
          if [ "$mode" = "beta" ] || [ "$mode" = "snapshot" ]; then
            # Nach einem regulären Release ist die Basis weiter als build.gradle; ohne Angabe hießen die JARs noch
            # nach build.gradle und die Prüfung unten fände sie nicht.
            # develop trägt dieselbe Art Version wie main: so kann main den geprüften develop-Stand unverändert als
            # latest übernehmen (Schritt „Geprüften develop-Stand übernehmen“), und --version nennt eine eindeutige Nummer
            version="$base-beta.$(git rev-list --count HEAD)"
            if [ "$mode" = "beta" ]; then tag="$BETA_TAG"; else tag="$SNAPSHOT_TAG"; fi
            echo "args=-PreleaseVersion=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
              || { echo "::error::Tag $tag folgt nicht v<Major>.<Minor>.<Patch>[-<Vorabkennung>]"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::Tag $tag zeigt nicht auf einen Stand von main"; exit 1; }
            if [ "$mode" = "new-tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag gibt es schon"; exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $tag gibt es schon und wird nie überschrieben"; exit 1
            fi
            version="${tag#v}"
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
            if [ "$prerelease" = false ] && [ ! -s "docs/release-notes/$tag.md" ]; then
              echo "::error::Reguläres Release $tag braucht docs/release-notes/$tag.md auf main"; exit 1
            fi
            echo "args=-PreleaseVersion=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Modus $mode, Version $version, Tag $tag" >> "$GITHUB_STEP_SUMMARY"
      # Angelo 28.11.: kein zweiter Bau für latest. Das Bündel develop → main bringt genau den Stand nach main, den der
      # Release-Lauf auf develop schon gebaut, getestet und als Snapshot veröffentlicht hat. Hat ein erfolgreicher
      # develop-Lauf denselben Dateibaum (git tree) wie dieser main-Commit, werden seine geprüften JARs übernommen
      # statt neu gebaut. Nur wenn es keinen solchen Lauf gibt (main enthält etwas, das develop so nie hatte, oder das
      # Artefakt ist abgelaufen), baut dieser Lauf selbst.
      - name: Geprüften develop-Stand übernehmen
        id: promote
        if: steps.version.outputs.mode == 'beta'
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=develop&event=push&status=success&per_page=50" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            dir="$RUNNER_TEMP/promoted"
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern "space-harvester-*-$sha" --dir "$dir"; then
              artifact=$(ls "$dir")
              version="${artifact#space-harvester-}"; version="${version%-$sha}"
              echo "Übernehme Lauf $id (develop $sha, Version $version)" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "dir=$dir/$artifact" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "Kein erfolgreicher develop-Lauf mit demselben Stand, latest wird hier gebaut" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.promote.outputs.dir == ''
      # build = alle Module mit Tests, appJarCheck (App-JAR mit --version und allen Bereichen), bootJarPacCheck (PAC im
      # Server-JAR), verifyPublishedPom (Core) sowie Core-JAR mit Sources und Javadoc
      - name: Alle Module bauen und testen
        if: steps.promote.outputs.dir == ''
        run: ./gradlew build ${{ steps.version.outputs.args }} --console=plain
      - name: Artefakte prüfen
        id: dist
        env:
          VERSION: ${{ steps.promote.outputs.version || steps.version.outputs.version }}
          MODE: ${{ steps.version.outputs.mode }}
          PROMOTED: ${{ steps.promote.outputs.dir }}
        run: |
          if [ -n "$PROMOTED" ]; then
            # Übernommene develop-JARs: unverändert, nur Prüfsummen und Version nachweisen
            (cd "$PROMOTED" && sha256sum -c SHA256SUMS)
            out=$(java -jar "$PROMOTED/space-harvester-app.jar" --version)
            echo "$out"
            [[ "$out" == *"$VERSION"* ]] || { echo "::error::App --version nennt nicht $VERSION"; exit 1; }
            echo "dir=$PROMOTED" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            { echo "### Space Harvester $VERSION (vom develop-Lauf übernommen)"; echo; echo '```'; cat "$PROMOTED/SHA256SUMS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          files=(
            "space-harvester-app/build/libs/space-harvester-app-$VERSION.jar"
            "space-harvester-server/build/libs/space-harvester-$VERSION.jar"
            "space-harvester-core/build/libs/space-harvester-core-$VERSION.jar"
            "space-harvester-core/build/libs/space-harvester-core-$VERSION-sources.jar"
            "space-harvester-core/build/libs/space-harvester-core-$VERSION-javadoc.jar"
          )
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error::$f fehlt"; exit 1; }
            cp "$f" "$dist/"
          done
          out=$(java -jar "$dist/space-harvester-app-$VERSION.jar" --version)
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "::error::App --version nennt nicht $VERSION"; exit 1; }
          info=$(unzip -p "$dist/space-harvester-$VERSION.jar" META-INF/build-info.properties)
          echo "$info"
          grep -qx "build.version=$VERSION" <<< "$info" || { echo "::error::Server-build-info nennt nicht $VERSION"; exit 1; }
          # Listing erst vollständig lesen: grep -q am Pipe-Ende würde unzip per SIGPIPE abbrechen (pipefail)
          core=$(unzip -Z1 "$dist/space-harvester-core-$VERSION.jar")
          if grep -q '^BOOT-INF/' <<< "$core"; then echo "::error::Core-JAR ist ein Fat-JAR"; exit 1; fi
          # Rollierende Stände (latest, snapshot) ohne Versionsnummer im Dateinamen: feste, bookmarkbare Adressen
          suffix="-$VERSION"
          if [ "$MODE" = "beta" ] || [ "$MODE" = "snapshot" ]; then
            for f in "$dist"/*.jar; do mv "$f" "${f/-$VERSION/}"; done
            suffix=""
          fi
          ls -l "$dist"
          (cd "$dist" && sha256sum *.jar > SHA256SUMS && cat SHA256SUMS)
          echo "dir=$dist" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          {
            echo "### Space Harvester $VERSION"
            echo
            echo '```'
            cat "$dist/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fehlgeschlagene Tests ins Log
        if: failure() && steps.promote.outputs.dir == ''
        run: python3 .github/scripts/test-summary.py --log space-harvester-*/build/test-results enterprise-ai-sources/build/test-results nlp-parser/build/test-results nlp-model-training/build/test-results
      - name: Testübersicht
        if: always() && steps.promote.outputs.dir == ''
        run: python3 .github/scripts/test-summary.py space-harvester-*/build/test-results enterprise-ai-sources/build/test-results nlp-parser/build/test-results nlp-model-training/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: space-harvester-${{ steps.promote.outputs.version || steps.version.outputs.version }}-${{ github.sha }}
          path: ${{ steps.dist.outputs.dir }}/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            space-harvester-app/build/app-jar-check/
          if-no-files-found: ignore
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.dist.outputs.dir }}/*.jar
      - name: Release-Notizen
        working-directory: ${{ steps.dist.outputs.dir }}
        env:
          MODE: ${{ steps.version.outputs.mode }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.promote.outputs.version || steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          BRANCH: ${{ github.ref_name }}
          SUFFIX: ${{ steps.dist.outputs.suffix }}
        run: |
          app="space-harvester-app$SUFFIX.jar"
          sum=$(grep " $app\$" SHA256SUMS | cut -d' ' -f1)
          if [ "$MODE" = "snapshot" ] || [ "$MODE" = "beta" ]; then
            intro="Rollierender Build vom main-Commit \`${GITHUB_SHA:0:12}\`, wird bei jedem Push auf main ersetzt. Feste Adresse für ein Lesezeichen: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/$app"
            [ "$MODE" = "snapshot" ] && intro="Rollierender Entwicklungsstand vom Branch \`$BRANCH\` (\`${GITHUB_SHA:0:12}\`), wird bei jedem Push auf einen Branch außer main ersetzt. Feste Adresse: https://github.com/$GITHUB_REPOSITORY/releases/download/snapshot/$app"
            ref="$GITHUB_SHA"
          else
            kind="Release"
            [ "$PRERELEASE" = "true" ] && kind="Vorabversion zum Testen"
            intro="Space Harvester $VERSION – $kind, gebaut aus \`${GITHUB_SHA:0:12}\` auf main."
            ref="$TAG"
          fi
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<NOTES
          $intro

          | Datei | Inhalt |
          |---|---|
          | \`$app\` | Desktop-App (Swing), startet ohne Server |
          | \`space-harvester$SUFFIX.jar\` | REST-Service (Spring Boot), [docs/MODULES.md](https://github.com/$GITHUB_REPOSITORY/blob/$ref/docs/MODULES.md) |
          | \`space-harvester-core$SUFFIX.jar\` (+ \`-sources\`, \`-javadoc\`) | Bibliothek für eigene Anwendungen, Abhängigkeiten nicht enthalten |
          | \`SHA256SUMS\` | Prüfsummen aller JARs |

          **Desktop-App unter Windows starten** (Java 21, z. B. Eclipse Temurin 21):

          1. \`$app\` herunterladen.
          2. Optional prüfen: \`certutil -hashfile $app SHA256\` muss \`$sum\` ergeben.
          3. \`java -jar $app\` starten; beim ersten Start führt der Einrichtungsassistent durch die erste Quelle (später **Verwaltung › Wissensquellen verwalten › Quelle hinzufügen …**).

          Zeigt \`java -version\` eine ältere Java-Version (z. B. 1.8), die App mit dem vollen Pfad zur \`java.exe\` des JDK 21 starten, etwa \`"C:\\Program Files\\…\\jdk-21…\\bin\\java.exe" -jar $app\`.

          Zugangsdaten nur über einen KeePass-Eintrag oder als Umgebungsvariable (\`\${VAR}\`), nie im Klartext in der Konfigurationsdatei.
          Anleitung: [docs/DESKTOP_APP.md](https://github.com/$GITHUB_REPOSITORY/blob/$ref/docs/DESKTOP_APP.md).
          NOTES
          # Kuratierte Release-Notizen (Pflicht für reguläre Releases) stehen vor der Dateiübersicht
          notes="$GITHUB_WORKSPACE/docs/release-notes/$TAG.md"
          if [ "$MODE" != "snapshot" ] && [ "$MODE" != "beta" ] && [ -s "$notes" ]; then
            { cat "$notes"; echo; echo '## Dateien'; echo; cat "$RUNNER_TEMP/RELEASE_NOTES.md"; } > "$RUNNER_TEMP/notes.tmp"
            mv "$RUNNER_TEMP/notes.tmp" "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi
      - name: Release-Notizen für das Veröffentlichen
        if: steps.version.outputs.mode == 'beta' || steps.version.outputs.mode == 'snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.sha }}
          path: ${{ runner.temp }}/RELEASE_NOTES.md
          if-no-files-found: error
      - name: Release anlegen
        if: steps.version.outputs.mode == 'tag' || steps.version.outputs.mode == 'new-tag'
        working-directory: ${{ steps.dist.outputs.dir }}
        env:
          MODE: ${{ steps.version.outputs.mode }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Keine Pre-Releases mehr (Angelo 16.11., wie aresstack/audio): das jeweils neueste Release ist „Latest“, also
          # ein getaggtes, bis der nächste main-Lauf das rollierende „latest“ wieder zum Latest macht
          # Beim Tag-Push existiert der Tag schon; sonst legt gh ihn auf dem gebauten Commit an
          ref=--verify-tag
          [ "$MODE" = "tag" ] || ref="--target=$GITHUB_SHA"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "$ref" --title "Space Harvester $VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" --prerelease=false --latest *.jar SHA256SUMS

  publish:
    # Veröffentlicht latest bzw. snapshot; nie abgebrochen, je Release nacheinander. Ältere Bauten bricht schon der
    # Job app ab, darum veröffentlicht hier höchstens noch ein Stand, der vor dem neueren fertig gebaut war.
    needs: app
    if: needs.app.outputs.mode == 'beta' || needs.app.outputs.mode == 'snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ needs.app.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: space-harvester-${{ needs.app.outputs.version }}-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ github.sha }}
          path: notes
      - name: Rollierendes Release latest bzw. snapshot aktualisieren
        working-directory: dist
        env:
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ needs.app.outputs.mode }}
          TAG: ${{ needs.app.outputs.tag }}
          VERSION: ${{ needs.app.outputs.version }}
        run: |
          set -euo pipefail
          title="Space Harvester – current build"
          flags=(--prerelease=false --latest)
          if [ "$MODE" = "snapshot" ]; then
            # Andere Branches: ein rollierendes Pre-Release ohne Versionsnummer, nie Latest (Angelo 16.11.)
            title="Space Harvester – Snapshot ($BRANCH)"
            flags=(--prerelease --latest=false)
          fi
          # Aufräumen (Angelo 16.11.): nur „latest“ und explizit getaggte Releases bleiben (dazu das NLP-Modell
          # maltparser-*, das die App von dort lädt). Alte v<x.y.z>-beta.<N> und die abgelösten rollierenden Releases
          # werden gelöscht; nach dem ersten Lauf ist nichts mehr zu tun.
          old=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || true)
          [ "$MODE" = "beta" ] || old=""
          [ "$MODE" = "beta" ] && obsolete="$OBSOLETE_RELEASES" || obsolete=""
          for t in $obsolete $old; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Lösche Release $t"
              if [ "$t" = beta ]; then
                gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              else
                gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes
              fi
            fi
          done
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes-file "$GITHUB_WORKSPACE/notes/RELEASE_NOTES.md" \
              "${flags[@]}" *.jar SHA256SUMS
          else
            # Release bleibt bestehen (feste Adresse), nur Tag, Text und Dateien wandern auf diesen Stand
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" \
              --notes-file "$GITHUB_WORKSPACE/notes/RELEASE_NOTES.md" "${flags[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.jar SHA256SUMS
            # Dateien früherer Läufe, die dieser Stand nicht mehr enthält (z. B. alte Namen mit Versionsnummer)
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -e "$asset" ] && continue
              # Fremde Dateien (auch deren vorläufiger Name „….new“ während des Hochladens) bleiben
              foreign=false
              for f in $FOREIGN_ASSETS; do [[ "$asset" == "$f" || "$asset" == "$f".* ]] && foreign=true; done
              [ "$foreign" = true ] && continue
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          fi
