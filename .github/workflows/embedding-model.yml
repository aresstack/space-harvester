name: Embedding-Modell

# Prüft den lokalen ONNX-Provider (#89) gegen das echte, fest gepinnte multilingual-e5-small. Die Modelldateien
# kommen nie ins Repository; dieser Job lädt die gepinnte Revision, prüft die SHA-256 und vergleicht die Vektoren des
# Harvesters mit den Referenzvektoren der PyTorch-Implementierung.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/embedding-model.yml'
      - 'tools/embedding/**'
      - 'src/main/java/com/aresstack/spaceharvester/embedding/**'
      - 'src/test/resources/embedding/**'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Revision und Dateien
        run: |
          api=https://huggingface.co/api/models/intfloat/multilingual-e5-small
          curl -sSf "$api/revision/main" | python3 -c "import json,sys; d=json.load(sys.stdin); print('main', d['sha'], d.get('lastModified'))"
          rev=$(curl -sSf "$api/revision/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          for dir in "" onnx; do
            curl -sSf "$api/tree/$rev/$dir" | python3 -c "
          import json,sys
          for e in json.load(sys.stdin):
              print(e['path'], e.get('size'), (e.get('lfs') or {}).get('oid', e.get('oid')))"
          done
