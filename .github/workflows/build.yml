name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den überholten Lauf ab; main läuft immer vollständig.
concurrency:
  # Pushes (main, develop) bekommen je Commit eine eigene Gruppe: Bei vielen Merges wurde sonst jeder Lauf
  # abgebrochen und kein develop-Stand je fertig geprüft (23.11.). PRs brechen ihren älteren Lauf weiter ab.
  group: build-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bewusst ohne Secrets: Tests laufen gegen Fake-Confluence und temporäre Verzeichnisse (#15).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      # Kopien in enterprise-ai-sources, comic-controls und enterprise-ai-keepass gegen den festgehaltenen Upstream-Commit prüfen (siehe UPSTREAM.md)
      - run: enterprise-ai-sources/sync-from-upstream.sh verify
      - run: comic-controls/sync-from-upstream.sh verify
      - run: enterprise-ai-keepass/sync-from-upstream.sh verify
      # Paritätsbericht Core gegen Enterprise AI Client (ADR 0012, docs/PARITY.md)
      - name: Paritätsbericht
        if: always()
        run: cat parity-tests/build/reports/parity/parity-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fehlgeschlagene Tests ins Log
        if: failure()
        run: python3 .github/scripts/test-summary.py --log space-harvester-*/build/test-results browser-runtime/build/test-results proving-ground/build/test-results parity-tests/build/test-results enterprise-ai-sources/build/test-results nlp-parser/build/test-results nlp-model-training/build/test-results
      - name: Testübersicht
        if: always()
        run: python3 .github/scripts/test-summary.py space-harvester-*/build/test-results browser-runtime/build/test-results proving-ground/build/test-results parity-tests/build/test-results enterprise-ai-sources/build/test-results nlp-parser/build/test-results nlp-model-training/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            space-harvester-*/build/reports/tests/
            space-harvester-*/build/test-results/
            enterprise-ai-sources/build/reports/tests/
            enterprise-ai-sources/build/test-results/
            nlp-parser/build/reports/tests/
            nlp-parser/build/test-results/
            nlp-model-training/build/reports/tests/
            nlp-model-training/build/test-results/
            space-harvester-app/build/app-jar-check/screenshots/
            parity-tests/build/test-results/
            parity-tests/build/reports/parity/
          if-no-files-found: ignore
  # Abnahme der Browser-Laufzeit (ADR 0046) mit dem installierten Standard-Firefox des Runners, ohne zusätzliche
  # Browser-Installation und ohne gewählte Programmdatei (Erkennung an den üblichen Orten): echter Start, dauerhaftes
  # Profil, Zurück/Vor ohne BFCache (playwright4j#79), gemeldetes Add-on. Ein fehlender Firefox schlägt fehl.
  browser-runtime-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firefox des Runners
        run: |
          firefox --version
          readlink -f "$(command -v firefox)"
      - name: Browser-Laufzeit mit Firefox
        env:
          BROWSER_RUNTIME_TEST_CHANNEL: firefox
        run: ./gradlew :browser-runtime:liveTest --console=plain
      - name: Kein Test übersprungen außer dem Chrome/Edge-Pfad
        working-directory: browser-runtime/build/test-results/liveTest
        run: |
          ls TEST-*.xml
          skipped="$(grep -B1 "<skipped" TEST-*.xml | grep -o 'testcase name="[^"]*"' | grep -v chromeAndEdge || true)"
          test -z "$skipped" || { echo "übersprungen: $skipped"; exit 1; }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-firefox
          path: |
            browser-runtime/build/test-results/liveTest/
            browser-runtime/build/reports/tests/liveTest/
          if-no-files-found: ignore
  # Der erste Browser-Schritt eines Chats im Profil Intern wie in der App (Seite öffnen und interne Suche in einer
  # Runde), mit dem Firefox des Runners, auch unter Unternehmensrichtlinien wie auf dem Dienstrechner.
  chat-browser-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        policy: [none, addons-blocked, start-page]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firefox des Runners
        id: firefox
        run: |
          path="$(readlink -f "$(command -v firefox)")"
          "$path" --version
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Unternehmensrichtlinie ${{ matrix.policy }}
        run: |
          case "${{ matrix.policy }}" in
            none) exit 0 ;;
            addons-blocked) policy='{"policies":{"ExtensionSettings":{"*":{"installation_mode":"blocked"}}}}' ;;
            start-page) policy='{"policies":{"Homepage":{"URL":"about:home","StartPage":"homepage","Locked":true}}}' ;;
          esac
          dir="$(dirname "${{ steps.firefox.outputs.path }}")/distribution"
          sudo mkdir -p "$dir" /etc/firefox/policies
          echo "$policy" | sudo tee "$dir/policies.json" /etc/firefox/policies/policies.json
      - name: Seite öffnen und interne Suche in einer Runde
        env:
          CHAT_BROWSER_TEST_CHANNEL: firefox
        run: xvfb-run -a ./gradlew :space-harvester-app:test --tests '*ChatWebBrowserFirefoxLiveTest' -i --console=plain
      - name: Nicht übersprungen
        working-directory: space-harvester-app/build/test-results/test
        run: |
          ls TEST-*ChatWebBrowserFirefoxLiveTest.xml
          ! grep -q "<skipped" TEST-*ChatWebBrowserFirefoxLiveTest.xml
  # Proving Ground (#1153), vertikaler Prototyp mit dem Standard-Firefox des Runners: originaler Playwright-Recorder über
  # WebDriver BiDi, Testfall speichern/laden/bearbeiten, Wiedergabe mit Assertions und Trace. Ein fehlender Firefox
  # schlägt fehl (kein übersprungener Test).
  proving-ground-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firefox des Runners
        run: firefox --version
      - name: Aufnehmen und Abspielen mit Firefox
        env:
          PROVING_GROUND_TEST_CHANNEL: firefox
        run: ./gradlew :proving-ground:liveTest --console=plain
      - name: Kein Test übersprungen
        working-directory: proving-ground/build/test-results/liveTest
        run: |
          ls TEST-*.xml
          ! grep -q "<skipped" TEST-*.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proving-ground-firefox
          path: |
            proving-ground/build/test-results/liveTest/
            proving-ground/build/reports/tests/liveTest/
          if-no-files-found: ignore
