name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den überholten Lauf ab; main läuft immer vollständig.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bewusst ohne Secrets: Tests laufen gegen Fake-Confluence und temporäre Verzeichnisse (#15).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      # Kopie in enterprise-ai-sources gegen den festgehaltenen Upstream-Commit prüfen (siehe UPSTREAM.md)
      - run: enterprise-ai-sources/sync-from-upstream.sh verify
      - name: Testübersicht
        if: always()
        run: python3 .github/scripts/test-summary.py build/test-results enterprise-ai-sources/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            enterprise-ai-sources/build/reports/tests/
          if-no-files-found: ignore
