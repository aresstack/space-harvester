name: Build

on:
  push:
    # Arbeitszweig der Buchfunktion: baut mit dem unveröffentlichten Writing4j per Composite Build (siehe unten).
    branches: [main, develop, claude/project-thread-kcf5hj]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den überholten Lauf ab; main läuft immer vollständig.
concurrency:
  # Pushes (main, develop) bekommen je Commit eine eigene Gruppe: Bei vielen Merges wurde sonst jeder Lauf
  # abgebrochen und kein develop-Stand je fertig geprüft (23.11.). PRs brechen ihren älteren Lauf weiter ab.
  group: build-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bewusst ohne Secrets: Tests laufen gegen Fake-Confluence und temporäre Verzeichnisse (#15).
    # Arbeitszweig: Space Harvester liegt neben Writing4j (unveröffentlicht, vom aktuellen main), das per Composite Build
    # eingebunden wird (settings.gradle, -Paresstack.libs); Knowledge4j und Research4j kommen von Maven Central.
    defaults:
      run:
        working-directory: space-harvester
    steps:
      - uses: actions/checkout@v4
        with:
          path: space-harvester
      - uses: actions/checkout@v4
        with:
          repository: aresstack/writing4j
          ref: main
          path: writing4j
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain -Paresstack.libs=..
      # Arbeitszweig: startbare Desktop-App zum Herunterladen als Artefakt des Laufs (kein Release, kein Tag); die
      # Commits der Bibliotheken stehen in der Laufübersicht, damit klar ist, welcher Stand im JAR steckt.
      - name: App-JAR des Arbeitszweigs bereitstellen
        if: github.ref == 'refs/heads/claude/project-thread-kcf5hj'
        run: |
          mkdir -p build/arbeitszweig
          cp space-harvester-app/build/libs/space-harvester-app-*-SNAPSHOT.jar build/arbeitszweig/space-harvester-app.jar
          java -jar build/arbeitszweig/space-harvester-app.jar --version
          {
            echo "### Arbeitszweig-App"
            echo "space-harvester $(git rev-parse --short HEAD), writing4j $(git -C ../writing4j rev-parse --short HEAD)"
          } | tee build/arbeitszweig/STAND.txt >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref == 'refs/heads/claude/project-thread-kcf5hj'
        uses: actions/upload-artifact@v4
        with:
          name: space-harvester-app-arbeitszweig-${{ github.sha }}
          path: space-harvester/build/arbeitszweig/
          if-no-files-found: error
      # Kopien in enterprise-ai-sources, comic-controls, enterprise-ai-keepass und enterprise-ai-browser gegen den festgehaltenen Upstream-Commit prüfen (siehe UPSTREAM.md)
      - run: enterprise-ai-sources/sync-from-upstream.sh verify
      - run: comic-controls/sync-from-upstream.sh verify
      - run: enterprise-ai-keepass/sync-from-upstream.sh verify
      - run: enterprise-ai-browser/sync-from-upstream.sh verify
      # Paritätsbericht Core gegen Enterprise AI Client (ADR 0012, docs/PARITY.md)
      - name: Paritätsbericht
        if: always()
        run: cat parity-tests/build/reports/parity/parity-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Testübersicht
        if: always()
        run: python3 .github/scripts/test-summary.py space-harvester-*/build/test-results parity-tests/build/test-results enterprise-ai-sources/build/test-results nlp-parser/build/test-results nlp-model-training/build/test-results >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            space-harvester/space-harvester-*/build/reports/tests/
            space-harvester/space-harvester-*/build/test-results/
            space-harvester/enterprise-ai-sources/build/reports/tests/
            space-harvester/enterprise-ai-sources/build/test-results/
            space-harvester/nlp-parser/build/reports/tests/
            space-harvester/nlp-parser/build/test-results/
            space-harvester/nlp-model-training/build/reports/tests/
            space-harvester/nlp-model-training/build/test-results/
            space-harvester/space-harvester-app/build/app-jar-check/screenshots/
            space-harvester/parity-tests/build/test-results/
            space-harvester/parity-tests/build/reports/parity/
          if-no-files-found: ignore
