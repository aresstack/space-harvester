// Command Deck (#1142): interaktive Host-Systeme. Fachmodell und Anwendungsfälle in
// com.aresstack.spaceharvester.deck.terminal (ohne Swing, ohne OpenTerm), der OpenTerm-Adapter in ...terminal.openterm;
// NDV ebenso: deck.ndv (Fachmodell) und der PAL-Adapter deck.ndv.pal;
// BetaView: Fachmodell in ...deck.betaview (ohne Swing, ohne HTTP/HTML), der HTTP-Adapter in ...betaview.http.
// Gehört nur zur Desktop-App: Eine Terminal-Sitzung ist keine indizierbare Quelle, deshalb nie im Core oder Dienst.
// Aufbau nach dem Muster von aresstack/corenth (Ports und Adapter; UI -> Anwendungsfall -> Fachmodell <- Adapter).
plugins {
    id 'java-library'
    // Schein-Host (FakeTn3270Host) auch für die Tests und Bildschirmfotos der App
    id 'java-test-fixtures'
}

description = 'Command Deck: interaktive Sitzungen mit Host-Systemen (TN3270 über OpenTerm, BetaView über HTTP).'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // TN3270-Emulation wie in MainframeMate (reines Java, LGPL, keine nativen Teile)
    implementation libs.openterm
    // BetaView-Seiten lesen wie in MainframeMate (betaview-integration nutzt ebenfalls jsoup)
    implementation libs.jsoup
    // JSON-Antworten (offene Reiter, Seitentext) mit einem echten Parser statt Klammersuche
    implementation libs.jackson.jr.objects
    // FTP und JES wie in MainframeMate (Apache Commons Net, reines Java)
    implementation libs.commons.net
    // NDV (#1142): PAL-Protokoll (NATSPOD) aus MainframeMate, in derselben Kopie, die auch die NDV-Quelle nutzt;
    // nur der Adapter deck.ndv.pal spricht damit
    implementation project(':enterprise-ai-sources')
    // Natural-Parser und Abhängigkeitsanalyse nur einmal: im Sprachmodul (#1486); Typen stehen in der NDV-Analyse-API
    api project(':mainframe-languages')

    // Erfundene Outlook-Nachricht der Schein-E-Akte (FakeOutlookMessage): OLE2 über das POIFS von Apache POI
    testFixturesImplementation "org.apache.poi:poi:${libs.versions.poi.get()}"
    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation platform(libs.spring.boot.dependencies)
    testImplementation 'org.assertj:assertj-core'
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}
