# Rezept des deutschen MaltParser-Modells (#99). Jede Änderung hier ist eine bewusste Modelländerung mit neuer
# model.version (README.md, Neutraining); ein Release-Tag wird nie überschrieben.

model.id=maltparser-de-gsd
# MAJOR: Eingabevertrag oder Labelset ändern sich, MINOR: Neutraining bei gleichem Vertrag, PATCH: nur neu verpackt
model.version=1.0.0
# MaltParser lädt die .mco über ihren Namen; der Name bleibt über alle Versionen gleich
model.configName=maltparser-de-gsd
# Muss zu gradle/libs.versions.toml passen (MaltParserVersionTest)
maltparser.version=1.9.2

# UD German GSD, Release r2.18, geladen über die Commit-URL, nie über einen Branch
treebank.name=UD_German-GSD
treebank.repository=https://github.com/UniversalDependencies/UD_German-GSD
treebank.release=r2.18
treebank.commit=81d8c3612a88f5867fd089e9c0a5466ef230078b
treebank.file.train=de_gsd-ud-train.conllu
treebank.file.train.sha256=6cb1b600029292fb7bf60531a1d6d7824544791d732c0f7abae8102a2ac337bf
treebank.file.dev=de_gsd-ud-dev.conllu
treebank.file.dev.sha256=01e8e674973592747ffe9a8c77fcf9d2f5936a8484e731ad4f76254318a8952c
treebank.file.test=de_gsd-ud-test.conllu
treebank.file.test.sha256=595070aa50b706a91dc66f17c296f7a9a25cbc75269f177c27680fb1c21528ab
treebank.file.license=LICENSE.txt
treebank.file.license.sha256=899b1804a12ebc090b96339614eede1b64b686721b650a71430b55b5235f7f79
treebank.file.readme=README.md
treebank.file.readme.sha256=5d1af1a1fb974e83ccb9ad9446d19a13d4608faf1f57ee2bf85d4e8351cf5fa2

# Gewählt auf Dev (README.md, Konfigurationswahl): Stack-Lazy mit Swap (nicht projektiv), LIBLINEAR, eigenes
# Featuremodell nur aus FORM und UPOS
training.algorithm=stacklazy
training.learner=liblinear
training.featureModel=feature-model.xml
training.heap=6g
training.timeoutMinutes=120

# Vorgesehene Modelllizenz; explizite Freigabe ist in docs/NLP_MODEL_LICENSE.md dokumentiert.
# Die öffentliche Veröffentlichung erfordert weiterhin Workflow-Neuverpackung und manuelle Release-Prüfung.
license.model=CC-BY-SA-4.0
license.approval=approved

# Qualitätsgrenzen (Prozent); evaluate bricht darunter ab, package verweigert dann das Verpacken.
# Gesetzt nach dem ersten Lauf von v1.0.0: gemessener Wert minus 1 Punkt; Folgeversionen dürfen nicht schlechter sein.
# v1.0.0 (2026-10-17): test.gold UAS 84,42 / LAS 79,40, test.predicted LAS 71,60
quality.minimum.test.gold.uas=83.4
quality.minimum.test.gold.las=78.4
quality.minimum.test.predicted.las=70.6
