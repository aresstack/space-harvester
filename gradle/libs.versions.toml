# Zentrale Versionsdeklaration. Spring Boot verwaltet über seine BOM die Versionen
# aller Spring-Starter; hier stehen nur Plugins und Bibliotheken außerhalb der BOM.

[versions]
# Bibliotheken der Ask-AI-Aufteilung: Gradle ersetzt diese Koordinaten durch die Kopien unter libs/ (Composite Build,
# settings.gradle, libs/README.md); die Versionen hier haben deshalb keine Wirkung.
knowledge4j = "0.3.0"
research4j = "0.3.0"
# Treiber-Prozess der Chat-Websuche (GraalVM 25 nur dort, ADR 0046); dieselbe Fassung wie in Research4j
playwright4j = "0.3.0"
# Playwright-API für die Browser-Laufzeit; dieselbe Fassung wie in Research4j (browser-playwright)
playwright = "1.62.0"
writing4j = "0.5.0"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springdoc = "3.1.1"
archunit = "1.4.1"
# TN3270-Emulation des Command Deck (#1142), dieselbe Fassung wie in MainframeMate; reines Java, LGPL
openterm = "1.7.2"
# Gemeinsamer Editor des Command Deck (Dateien, später FTP/NDV): Syntaxhervorhebung wie in MainframeMate, dort 3.3.3
# wegen Java 8; hier die aktuelle Fassung (BSD-3, reines Java, ohne weitere Abhängigkeiten)
rsyntaxtextarea = "4.0.1"
# Parser für JCL (Grammatik aus MainframeMate) im Modul mainframe-languages; dort 4.9.3 wegen Java 8, hier die aktuelle
antlr = "4.13.2"
# Spring Cloud Azure 7.4.x baut gegen Spring Boot 4.1 (spring-cloud-azure-autoconfigure 7.4.0 → Boot 4.1.0)
springCloudAzure = "7.4.0"
# Spring Cloud 2025.1 (Boot 4.0): für Boot 4.1 gibt es nur Meilensteine; nur der Config-Client, geprüft in ConfigServerImportTest
springCloud = "2025.1.3"
# Proxy-Route je Ziel-URL (PAC/WPAD), dieselbe Version wie im Upstream; bringt GraalJS 21.2 mit (#34)
winProxy = "0.3.0"
# Serverzertifikate aus dem Windows-Zertifikatspeicher für die Desktop-App, dieselbe Version wie im Enterprise AI Client
winTrust = "0.1.0"
# Eingebetteter Seiten-Cache und Index (#26)
lucene = "10.5.2"
# PDF-Ausgabe (#30); dieselbe Fassung wie Tika (tika-parent 3.3.3: pdfbox.version 3.0.8), damit nur eine im Klassenpfad liegt
pdfbox = "3.0.8"
# space-harvester-core (#100): ohne die Spring-Boot-BOM, deshalb hier fest; abgestimmt auf Spring Boot 4.1.1,
# der Server erzwingt über die BOM dieselben Versionen
jackson = "3.1.5"
springFramework = "7.0.9"
reactorNetty = "1.3.7"
slf4j = "2.0.18"
# Deutsches UD-Parsing (#98, ADR 0005), nur im Modul nlp-parser: MaltParser (BSD-3) mit reload4j statt Log4j 1.2.16,
# Satz-, Token-, Wortarten- und Grundformmodelle von Apache OpenNLP (UD German GSD) aus Maven Central
maltparser = "1.9.2"
reload4j = "1.2.26"
opennlp = "2.5.12"
opennlpModelsDe = "1.3.0"
jacksonJr = "2.20.0"
# Tests der Module ohne Spring-BOM (nlp-parser)
junit = "5.13.4"
# enterprise-ai-sources: dieselben Versionen wie im Upstream (aresstack/enterprise-ai-client)
gson = "2.10.1"
javaWebsocket = "1.5.2"
reflections = "0.10.2"
jsoup = "1.17.2"
# Dokument-Extraktion (deigma/document-tika, #183). Der Upstream nutzt Tika 2.9.1 (Java 8, PDFBox 2.0); hier Tika 3.3,
# weil der Space Harvester PDFBox 3 und POI 5.5 nutzt und Tika 2.9 gegen PDFBox 3 nicht läuft. Java 21 genügt Tika 3.
tika = "3.3.3"
# draw.io-Diagramme ohne Browser (drawio-java: Original-draw.io-JavaScript auf GraalJS 21.3, Java2D/Batik 1.20, MIT),
# wie im Enterprise AI Client. Gradle hebt GraalJS von mermaid-java/win-proxy-java (21.2) auf 21.3.20.0.3 an; GraalJS-
# Module nicht zurückzwingen, gemischte Truffle-Fassungen scheitern zur Laufzeit.
drawioJava = "0.1.0"
# Git-Quelle (source-git, #187): dieselbe Fassung wie im Enterprise AI Client
jgit = "5.13.5.202508271544-r"
# FTP/JES-Quelle (source-ftp, #187): dieselbe Fassung wie im Enterprise AI Client
commonsNet = "3.9.0"
# Outlook-Quelle (source-outlook, #187): dieselbe Fassung wie im Enterprise AI Client
javaLibpst = "0.9.3"
junit4 = "4.13.2"
# Word-Ausgabe (:docx-export, Kopie aus enterprise-ai-client): Markdown-Parser in derselben Fassung wie dort,
# Apache POI in der aktuellen 5.x (dort 5.2.3 wegen Tika 2.9; hier dieselbe 5.5.1 wie Tika 3.3.3)
flexmark = "0.62.2"
# Mermaid und SVG offline als Bild (GraalJS 21.2 wie win-proxy-java, Batik), wie im Enterprise AI Client
mermaidJava = "0.2.0-beta.2"
# Diagramm-Ansicht „Visuell“ im Command Deck (mermaid-renderer, Kopie aus MainframeMate): GraalJS wie drawio-java
graalJs = "21.3.20.0.3"
poi = "5.5.1"
# E-Mails (.eml) im Anhang-Viewer: Apache James Mime4j in derselben Fassung wie in Tika 3.3.3 (tika-parser-mail)
mime4j = "0.8.15"
# Desktop-App (#103): YAML-Konfiguration ohne Spring, dieselbe Fassung wie über Spring Boot 4.1
snakeyaml = "2.4"
# QR-Codes für den Zertifikatsexport einer Quelle (Strang ZX): nur zxing core (Apache-2.0, reines Java, ohne
# weitere Abhängigkeiten); Bild-Anbindung selbst, damit zxing javase (jcommander, jai-imageio) entfällt
zxing = "3.5.3"

