# Zentrale Versionsdeklaration. Spring Boot verwaltet über seine BOM die Versionen
# aller Spring-Starter; hier stehen nur Plugins und Bibliotheken außerhalb der BOM.

[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springdoc = "3.1.1"
archunit = "1.4.1"
# Spring Cloud Azure 7.4.x baut gegen Spring Boot 4.1 (spring-cloud-azure-autoconfigure 7.4.0 → Boot 4.1.0)
springCloudAzure = "7.4.0"
# Spring Cloud 2025.1 (Boot 4.0): für Boot 4.1 gibt es nur Meilensteine; nur der Config-Client, geprüft in ConfigServerImportTest
springCloud = "2025.1.3"
# Proxy-Route je Ziel-URL (PAC/WPAD), dieselbe Version wie im Upstream; bringt GraalJS 21.2 mit (#34)
winProxy = "0.2.0"
# Eingebetteter Seiten-Cache und Index (#26)
lucene = "10.5.2"
# PDF-Ausgabe (#30)
pdfbox = "3.0.5"
# Lokales Embedding-Modell (#89): ONNX Runtime (1.30.0 stürzt in manchen Containern beim Start ab) und der
# Hugging-Face-Tokenizer von DJL, beide mit nativen Bibliotheken für Linux, Windows und macOS im Jar
onnxruntime = "1.31.0"
djlTokenizers = "0.38.0"
# Deutsches UD-Parsing (#98, ADR 0005), nur im Modul nlp-parser: MaltParser (BSD-3) mit reload4j statt Log4j 1.2.16,
# Satz-, Token-, Wortarten- und Grundformmodelle von Apache OpenNLP (UD German GSD) aus Maven Central
maltparser = "1.9.2"
reload4j = "1.2.26"
opennlp = "2.5.12"
opennlpModelsDe = "1.3.0"
jacksonJr = "2.20.0"
# Tests der Module ohne Spring-BOM (nlp-parser)
junit = "5.13.4"
# enterprise-ai-sources: dieselben Versionen wie im Upstream (aresstack/enterprise-ai-client)
gson = "2.10.1"
jsoup = "1.17.2"
jgraphx = "4.2.2"
junit4 = "4.13.2"

[libraries]
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jgraphx = { module = "com.github.vlsi.mxgraph:jgraphx", version.ref = "jgraphx" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
win-proxy-java = { module = "com.aresstack:win-proxy-java", version.ref = "winProxy" }
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }
spring-cloud-azure-dependencies = { module = "com.azure.spring:spring-cloud-azure-dependencies", version.ref = "springCloudAzure" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djlTokenizers" }
maltparser = { module = "org.maltparser:maltparser", version.ref = "maltparser" }
reload4j = { module = "ch.qos.reload4j:reload4j", version.ref = "reload4j" }
opennlp-tools = { module = "org.apache.opennlp:opennlp-tools", version.ref = "opennlp" }
opennlp-models-sentdetect-de = { module = "org.apache.opennlp:opennlp-models-sentdetect-de", version.ref = "opennlpModelsDe" }
opennlp-models-tokenizer-de = { module = "org.apache.opennlp:opennlp-models-tokenizer-de", version.ref = "opennlpModelsDe" }
opennlp-models-pos-de = { module = "org.apache.opennlp:opennlp-models-pos-de", version.ref = "opennlpModelsDe" }
opennlp-models-lemmatizer-de = { module = "org.apache.opennlp:opennlp-models-lemmatizer-de", version.ref = "opennlpModelsDe" }
jackson-jr-objects = { module = "com.fasterxml.jackson.jr:jackson-jr-objects", version.ref = "jacksonJr" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
