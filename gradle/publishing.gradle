// Maven-Publikation (#100, docs/MODULES.md): Koordinaten unter com.aresstack, POM mit Lizenz, SCM und Entwicklern,
// Sources- und Javadoc-JAR. Ziel ist das lokale Verzeichnis build/repo; daraus packt die Wurzel-Task centralBundle
// das Bundle, das der Workflow Release bei regulären Releases nach Maven Central hochlädt. Signiert wird nur, wenn
// GPG_PRIVATE_KEY gesetzt ist (Secrets der Organisation aresstack, wie bei win-proxy-java).
apply plugin: 'maven-publish'
apply plugin: 'signing'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.aresstack'
            artifactId = project.ext.publishedArtifactId
            from components.java
            // testFixtures gehören nicht in die veröffentlichte Bibliothek
            suppressAllPomMetadataWarnings()
            pom {
                name = project.ext.publishedArtifactId
                description = project.description
                url = 'https://github.com/aresstack/space-harvester'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'aresstack'
                        name = 'AresStack'
                        url = 'https://github.com/aresstack'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/aresstack/space-harvester.git'
                    developerConnection = 'scm:git:ssh://git@github.com/aresstack/space-harvester.git'
                    url = 'https://github.com/aresstack/space-harvester'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

def signingKey = providers.environmentVariable('GPG_PRIVATE_KEY')
if (signingKey.isPresent()) {
    signing {
        useInMemoryPgpKeys(signingKey.get(), providers.environmentVariable('GPG_PASSPHRASE').getOrElse(''))
        sign publishing.publications.maven
    }
}

// Testfixtures nicht mitveröffentlichen.
plugins.withId('java-test-fixtures') {
    components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
    components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }
}
