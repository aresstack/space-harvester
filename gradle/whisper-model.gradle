import java.security.MessageDigest
import java.util.jar.JarFile

// Stage the exact Whisper Tiny model at build time and embed it into the one executable app JAR.
// Verify every file before publication; never download model files from the running application.
def whisperRevision = '169d4a4341b33bc18d8881c4b69c2e104e1cc0af'
def whisperHashes = [
        'config.json'      : 'ffdccec4f3211f4c63310f2b7098f309fe70f3952cedc5e4d11e43f5b2379b98',
        'model.safetensors': '7ebd0e69e78190ffe1438491fa05cc1f5c1aa3a4c4db3bc1723adbb551ea2395',
        'tokenizer.json'   : '27fc476bfe7f17299480be2273fc0608e4d5a99aba2ab5dec5374b4482d1a566',
        'vocab.json'       : '8f680bba319e01a653d2e8a5dbc17a9157179e0576e6ce74ce0c06356c6e24f9'
]
def stagedModel = layout.buildDirectory.dir('embedded-whisper-model')
def modelCache = new File(gradle.gradleUserHomeDir, "caches/space-harvester/whisper-tiny/${whisperRevision}")
def manualSource = providers.gradleProperty('whisperModelDirectory')
        .orElse(providers.environmentVariable('SPACE_HARVESTER_WHISPER_MODEL_DIR')).orNull
def developmentSource = new File(rootProject.projectDir.parentFile.parentFile,
        'win-directml-java/model/whisper-tiny')

def sha256 = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    return digest.digest().encodeHex().toString()
}

def matches = { File file, String hash ->
    file.isFile() && sha256(file) == hash
}

def prepareModel = tasks.register('prepareWhisperModel') {
    group = 'build'
    description = 'Verify and stage the pinned Whisper Tiny model for the executable app JAR.'
    outputs.dir(stagedModel)
    doLast {
        File output = stagedModel.get().asFile
        output.mkdirs()
        modelCache.mkdirs()
        File source = manualSource ? file(manualSource) : developmentSource
        whisperHashes.each { filename, expected ->
            File destination = new File(output, filename)
            if (matches(destination, expected)) {
                return
            }
            File cached = new File(modelCache, filename)
            if (!matches(cached, expected)) {
                File provided = new File(source, filename)
                if (matches(provided, expected)) {
                    project.copy {
                        from provided
                        into modelCache
                    }
                } else {
                    File partial = new File(modelCache, filename + '.part')
                    partial.delete()
                    String url = "https://huggingface.co/openai/whisper-tiny/resolve/${whisperRevision}/${filename}"
                    logger.lifecycle("Fetching pinned Whisper model artifact: ${filename}")
                    def connection = new URL(url).openConnection()
                    connection.connectTimeout = 30000
                    connection.readTimeout = 900000
                    try {
                        connection.getInputStream().withCloseable { input ->
                            partial.withOutputStream { outputStream -> outputStream << input }
                        }
                        if (!matches(partial, expected)) {
                            throw new GradleException("Whisper model SHA-256 mismatch: ${filename}")
                        }
                        java.nio.file.Files.move(partial.toPath(), cached.toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    } finally {
                        partial.delete()
                    }
                }
            }
            if (!matches(cached, expected)) {
                throw new GradleException("Whisper model SHA-256 mismatch: ${filename}")
            }
            project.copy {
                from cached
                into output
            }
            if (!matches(destination, expected)) {
                throw new GradleException("Failed to stage Whisper model: ${filename}")
            }
        }
    }
}

// Make the verified model available to IDE and Gradle classpaths as well as the
// executable JAR. BootJar automatically packages processResources output.
tasks.named('processResources') {
    dependsOn prepareModel
    from(prepareModel) {
        into 'models/whisper-tiny'
    }
}

def verifyWhisperJar = tasks.register('verifyWhisperJar') {
    group = 'verification'
    description = 'Check that the executable app JAR contains the Whisper model and both license notices.'
    dependsOn tasks.named('bootJar')
    def jarFile = tasks.named('bootJar').flatMap { it.archiveFile }
    inputs.file(jarFile)
    doLast {
        new JarFile(jarFile.get().asFile).withCloseable { archive ->
            def required = whisperHashes.keySet().collect { "BOOT-INF/classes/models/whisper-tiny/${it}" }
            required.addAll([
                    'BOOT-INF/classes/licenses/whisper-MIT.txt',
                    'BOOT-INF/classes/licenses/whisper-Apache-2.0.txt',
                    'BOOT-INF/classes/licenses/whisper-MODEL-SOURCE.txt'
            ])
            required.each { entry ->
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("Executable app JAR is missing ${entry}")
                }
            }
        }
    }
}
tasks.named('check') {
    dependsOn verifyWhisperJar
}
