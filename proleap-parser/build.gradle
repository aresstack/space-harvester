plugins {
    id 'java-library'
    id 'antlr'
}

description = 'MIT-licensed ProLeap COBOL parser, built from pinned upstream sources.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    api {
        extendsFrom = extendsFrom.findAll { it != configurations.antlr }
    }
}

dependencies {
    antlr libs.antlr
    api libs.antlr.runtime
    implementation libs.slf4j.api

    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply from: 'ibm-replacement.gradle'

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-listener', '-package', 'io.proleap.cobol']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    from('LICENSE') {
        into 'META-INF/licenses/proleap-cobol-parser'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Lokale Änderungen an der Kopie erkennen (gemeinsame Prüfung in gradle/upstream-copy.gradle).
apply from: rootProject.file('gradle/upstream-copy.gradle')
def verifyUpstreamCopy = registerUpstreamCopyCheck(name: 'proleap-parser',
        manifest: file('UPSTREAM.sha256'),
        baseDir: projectDir,
        files: files('LICENSE', fileTree('src/main')),
        hint: 'Änderungen gehören in den ProLeap-Upstream und kommen als neuer Stand zurück',
        normalizeLineEndings: true)

tasks.named('compileJava') {
    dependsOn verifyUpstreamCopy
}
