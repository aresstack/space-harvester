plugins {
    id 'java-library'
    id 'antlr'
}

description = 'MIT-licensed ProLeap COBOL parser, built from pinned upstream sources.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    api {
        extendsFrom = extendsFrom.findAll { it != configurations.antlr }
    }
}

dependencies {
    antlr libs.antlr
    api libs.antlr.runtime
    implementation libs.slf4j.api

    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply from: 'ibm-replacement.gradle'

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-listener', '-package', 'io.proleap.cobol']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    from('LICENSE') {
        into 'META-INF/licenses/proleap-cobol-parser'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Protect the pinned upstream sources and license; normalize checkout line endings.
def verifyUpstreamCopy = tasks.register('verifyUpstreamCopy') {
    group = 'verification'
    description = 'Verify the pinned ProLeap source snapshot against UPSTREAM.sha256.'
    def manifestFile = layout.projectDirectory.file('UPSTREAM.sha256')
    def copied = layout.projectDirectory.dir('src/main')
    def license = layout.projectDirectory.file('LICENSE')
    inputs.file(manifestFile)
    inputs.dir(copied)
    inputs.file(license)
    doLast {
        def root = layout.projectDirectory.asFile.toPath()
        def expected = [:] as TreeMap
        manifestFile.asFile.eachLine('UTF-8') { line ->
            if (!line.isBlank() && !line.startsWith('#')) {
                def parts = line.split('  ', 2)
                expected[parts[1]] = parts[0]
            }
        }
        def actual = [:] as TreeMap
        ([license.asFile] + project.fileTree(copied).files).each { file ->
            def path = root.relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
            def normalized = new String(file.bytes, java.nio.charset.StandardCharsets.UTF_8)
                    .replace('\r\n', '\n')
            actual[path] = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(normalized.getBytes(java.nio.charset.StandardCharsets.UTF_8)).encodeHex().toString()
        }
        def differences = (expected.keySet() + actual.keySet()).unique()
                .findAll { expected[it] != actual[it] }
        if (differences) {
            throw new GradleException("ProLeap snapshot differs from UPSTREAM.sha256:\n  " + differences.join('\n  '))
        }
        logger.lifecycle("Verified ${actual.size()} pinned ProLeap files.")
    }
}

tasks.named('check') {
    dependsOn verifyUpstreamCopy
}

tasks.named('compileJava') {
    dependsOn verifyUpstreamCopy
}
