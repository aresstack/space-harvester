// Unveränderte Kopie der Swing-/Java2D-Comic-Bibliothek comic-controls aus aresstack/enterprise-ai-client
// (Paletten, Painter, Rahmen, Bedienelemente; nur JDK). Herkunft und Abgleich: UPSTREAM.md.
// Der Code ist Java-8-kompatibel; er wird hier mit Java 21 gebaut, seine JUnit-4-Tests laufen headless mit.
plugins {
    id 'java-library'
}

description = 'Comic-Bedienelemente des Enterprise AI Client für die Desktop-App (Kopie).'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation libs.junit4
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnit()
    systemProperty 'java.awt.headless', 'true'
}

// Lokale Änderungen an der Kopie erkennen (gemeinsame Prüfung in gradle/upstream-copy.gradle).
apply from: rootProject.file('gradle/upstream-copy.gradle')
def verifyUpstreamCopy = registerUpstreamCopyCheck(name: 'comic-controls',
        manifest: file('UPSTREAM.sha256'),
        baseDir: projectDir,
        files: files('LICENSE', fileTree('src')),
        upstream: 'aresstack/enterprise-ai-client')
