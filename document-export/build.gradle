// Word-Ausgabe des Enterprise AI Client (DocxExportWriter, MarkdownDocxRenderer, ExportGraphics) als eigene
// Bibliothek ohne Swing; angepasste Kopie, Herkunft und Abweichungen in UPSTREAM.md. Der Core hängt nur von diesem
// Modul ab, nie vom Enterprise AI Client selbst.
plugins {
    id 'java-library'
}

description = 'Word-Export (DOCX) mit Inhaltsverzeichnis, aus dem Enterprise AI Client übernommen.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // api: XWPFDocument und die Absätze erscheinen in der öffentlichen Schnittstelle von MarkdownDocxRenderer
    api libs.poi.ooxml
    // PDF-Ausgabe (PdfExportWriter)
    api libs.pdfbox
    implementation libs.flexmark
    // Mermaid-Diagramme und SVG-Bilder offline als PNG (GraalJS + Batik, ohne Browser und Netz)
    implementation libs.mermaid.java
    // draw.io → SVG wie im Enterprise AI Client (DrawioDiagramRenderer, #190)
    implementation libs.jgraphx
    implementation libs.flexmark.ext.tables
    implementation libs.flexmark.ext.autolink
    implementation libs.flexmark.ext.gfm.strikethrough

    testImplementation platform(libs.spring.boot.dependencies)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

// Eigene Publikation, damit die Core-POM keine unveröffentlichte Projektabhängigkeit nennt (docs/MODULES.md).
ext.publishedArtifactId = 'space-harvester-document-export'
apply from: rootProject.file('gradle/publishing.gradle')
