// Eigenständige Swing-Desktop-App (#103): nutzt die Anwendungsfälle der Core-Bibliothek direkt, ohne REST-Aufrufe,
// ohne HTTP-Server und ohne Spring-Kontext. Das Spring-Boot-Plugin dient nur dem Packaging: bootJar legt die
// Bibliotheken als verschachtelte JARs in ein einziges ausführbares JAR (wie beim Dienst, siehe bootJarPacCheck;
// GraalJS für PAC läuft dort nachweislich). Zur Laufzeit startet der Loader nur SpaceHarvesterApp.main.
plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
}

description = 'Space Harvester Desktop – Wissensquellen, Inhalte, Abgleich, Export und Suche als Swing-Anwendung.'

sourceSets {
    // Der Launcher ist für Java 8 übersetzt, damit ein schlichtes „java -jar“ oder ein Doppelklick ihn mit dem Java
    // laden kann, das der Rechner hat (bei Angelo ist Java 8 registriert). Er sucht dann ein Java 21 und startet die
    // App damit. Eine Klassendatei trägt ihre eigene Version, und eine JVM prüft nur die der Klassen, die sie lädt;
    // deshalb teilen sich beide Arten das JAR. Vorbild: aresstack/audio (Audio Studio) und aresstack/3d4j.
    launcher {
        java {
            srcDir 'src/launcher/java'
        }
    }
}

def launcherClass = 'com.aresstack.spaceharvester.launcher.Launcher'

// Mit eigener Main-Class legt das Spring-Boot-Plugin seinen Loader nicht mehr ins JAR (nur bei JarLauncher als
// Main-Class); der Launcher startet ihn aber unter Java 21. Deshalb kommt derselbe Loader hier ausdrücklich hinein.
configurations {
    bootLoader {
        canBeConsumed = false
        transitive = false
    }
    // Der Treiber-Prozess der Chat-Websuche (ADR 0046): playwright4j mit seinem GraalVM-25-Stapel. Diese JARs stehen
    // nie im Klassenpfad der App (dort lebt GraalJS 21.3 für Mermaid, draw.io und die PAC-Auswertung), sondern in
    // einem eigenen Ordner des App-JARs; PlaywrightDriverJars entpackt sie und gibt sie dem Kind-Prozess über
    // -Dplaywright4j.driver.classpath.
    playwrightDriver {
        canBeConsumed = false
    }
}

// Gruppen des GraalVM-25-Stapels von playwright4j, die aus dem Klassenpfad der App herausbleiben.
def playwrightDriverGraal = ['org.graalvm.polyglot', 'org.graalvm.sdk', 'org.graalvm.truffle', 'org.graalvm.js',
                             'org.graalvm.regex', 'org.graalvm.shadowed', 'org.graalvm.tools']

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Nur die Bibliothek, nie :space-harvester-server (#103)
    implementation project(':space-harvester-core')
    // Phase 3 der Buchfunktion: Research4j füllt den Korb über die neutralen Verträge von Knowledge4j (Arbeitszweig)
    implementation libs.research4j.core
    // Phase 4 der Buchfunktion: Writing4j schreibt aus dem Korb das Buch (Arbeitszweig, bis Writing4j veröffentlicht ist)
    implementation libs.writing4j.core
    implementation libs.knowledge4j.api
    implementation libs.knowledge4j.model
    implementation project(':document-export')
    // draw.io-XML-Schablonen (BPMN-Tasks/-Events, Flowchart, Basic, Pfeile) für drawio-java im Core
    runtimeOnly libs.drawio.stencils
    implementation project(':comic-controls')
    // Aussagenanalyse auf Knopfdruck (#499, ADR 0024): MaltParser und OpenNLP nur in der App, nie im Core oder Dienst;
    // das Modell lädt die App erst beim ersten Klick aus <Datenverzeichnis>/nlp-model, nie aus dem Netz
    implementation project(':nlp-parser')
    // Command Deck (#1142): Terminal-Sitzungen (TN3270 über OpenTerm), nur in der App
    implementation project(':command-deck')
    implementation project(':mainframe-languages')
    testImplementation testFixtures(project(':command-deck'))
    // Gemeinsamer Editor des Command Deck (app.ui.deck.editor)
    implementation libs.rsyntaxtextarea
    // Diagramm-Ansicht „Visuell“ des Editors (app.ui.deck.visual): Mermaid-Renderer aus MainframeMate
    implementation project(':mermaid-renderer')
    // KeePass koppeln und Einträge lesen/anlegen wie im Enterprise AI Client; nur die App, nie der Core
    implementation project(':enterprise-ai-keepass')
    // Websuche im Chat (ADR 0046): die Browser-Werkzeuge aus Research4j (browser-tools) und ihre Engine auf
    // Playwright (browser-playwright, Edge als Vorgabe). Der GraalVM-25-Stapel von playwright4j bleibt draußen; er
    // läuft nur im Treiber-Prozess (Konfiguration playwrightDriver).
    implementation libs.research4j.browser.tools
    implementation(libs.research4j.browser.playwright) {
        playwrightDriverGraal.each { group -> exclude group: group }
    }
    playwrightDriver libs.playwright4j
    implementation libs.snakeyaml
    // Chat-Antworten als Markdown wie im Enterprise AI Client (app.ui.markdown, Kopie von exedra.ui.markdown): flexmark
    // und mermaid-java in derselben Fassung wie document-export, keine neue Bibliothek
    implementation libs.flexmark
    implementation libs.flexmark.ext.tables
    implementation libs.flexmark.ext.autolink
    implementation libs.flexmark.ext.gfm.strikethrough
    implementation libs.mermaid.java
    // Zeichenfläche der Grafik-Artefakte (ADR 0045 §6): JSVGCanvas, selbst im SVG malen
    implementation libs.batik.swing
    implementation libs.jsoup
    // Eingebautes trust-bundle 'windows': JVM-Truststore plus Windows Root/CA wie im Enterprise AI Client
    implementation libs.win.trust.java
    // Originaldaten lesbar einrücken und body.storage zeigen; dieselbe Jackson-3-Fassung wie im Core
    implementation libs.jackson.databind
    implementation libs.slf4j.api
    // Anhang-Viewer (#183): PDF-Seiten zeichnen wie im Enterprise AI Client; dieselbe Fassung wie im Core
    implementation libs.pdfbox
    // Render PPTX and legacy PPT presentations locally in the reader.
    implementation libs.poi.ooxml
    // Embed VLC in Swing; keep libVLC native installation optional at runtime.
    implementation 'uk.co.caprica:vlcj:4.8.2'
    // Podcast als Video (Diashow mit Ton): H.264/MP4 in reinem Java wie die Aufnahme in Ask AI (askai-java8)
    implementation 'org.jcodec:jcodec-javase:0.2.5'
    // Use the Java 21 Whisper inference library with the guarded 30-second decoder of 0.3.2.
    implementation 'com.aresstack:directml-inference:0.3.2'
    // Reuse the published Ask AI Java DSP/VAD pipeline, without Silero or an ONNX runtime.
    implementation 'com.aresstack:directml-whisper-audio:0.3.2'
    implementation "org.apache.poi:poi-scratchpad:${libs.versions.poi.get()}"
    // E-Mails im Anhang-Viewer: Outlook (.msg) über POI HSMF (scratchpad), .eml über Mime4j wie in Tika
    implementation libs.mime4j.dom
    // Protokoll auf Konsole und in <Benutzerordner>/.space-harvester/logs; Version aus der Boot-BOM wie beim Dienst.
    // Schon zum Übersetzen nötig: Der Filter der Terminal-Ausgabe (ConsoleThreshold) ist ein Logback-Filter.
    implementation platform(libs.spring.boot.dependencies)
    implementation 'ch.qos.logback:logback-classic'
    // Apache POI (Word-Export) protokolliert über die Log4j-API; ohne Brücke meldete Log4j beim ersten Export einen
    // fehlenden Logging-Anbieter auf der Konsole
    runtimeOnly 'org.apache.logging.log4j:log4j-to-slf4j'

    testImplementation platform(libs.spring.boot.dependencies)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation testFixtures(project(':space-harvester-core'))
    testImplementation testFixtures(project(':enterprise-ai-sources'))
    // Kleines MaltParser-Testmodell (nicht das GSD-Modell) für den Adapter-Test
    testImplementation testFixtures(project(':nlp-parser'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets.launcher.output

    bootLoader "org.springframework.boot:spring-boot-loader:${libs.versions.springBoot.get()}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('compileLauncherJava') {
    options.release = 8
    options.compilerArgs += ['-Xlint:-options'] // Java 8 als Ziel ist veraltet, und hier gewollt
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

springBoot {
    mainClass = 'com.aresstack.spaceharvester.app.SpaceHarvesterApp'
}

// Das ausführbare App-JAR: space-harvester-app-<version>.jar
tasks.named('bootJar') {
    archiveBaseName = 'space-harvester-app'
    // Launcher-Klassen in die oberste Ebene (nicht BOOT-INF/classes), damit Java 8 sie ohne den Loader findet
    from sourceSets.launcher.output
    from({ configurations.bootLoader.filter { it.name.endsWith('.jar') }.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
    // Die JARs des Treiber-Prozesses der Chat-Websuche: ein eigener Ordner, nicht BOOT-INF/lib (ADR 0046)
    from(configurations.playwrightDriver) {
        into 'playwright-driver'
    }
    manifest {
        // Spring Boot setzt Main-Class nur, wenn keine angegeben ist; Start-Class bleibt SpaceHarvesterApp.
        attributes 'Main-Class': launcherClass,
                'Implementation-Title': 'Space Harvester Desktop', 'Implementation-Version': project.version
    }
}

tasks.named('jar') {
    enabled = false
}

// Nur eine GraalJS-Linie im Klassenpfad der App (ADR 0046, Abschnitt 4): kein polyglot 25 aus playwright4j, keine
// zweite Fassung des GraalVM-Stapels. Läuft mit check, damit eine spätere Abhängigkeit es nicht unbemerkt hereinzieht.
def graalLineCheck = tasks.register('graalLineCheck') {
    group = 'verification'
    description = 'Prüft, dass im Laufzeit-Klassenpfad der App nur eine GraalVM/GraalJS-Fassung steht.'
    def runtime = configurations.runtimeClasspath
    doLast {
        def graal = runtime.incoming.resolutionResult.allComponents
                .collect { it.moduleVersion }
                .findAll { it != null && it.group.startsWith('org.graalvm') }
        def versions = graal.collect { it.version }.unique()
        if (graal.any { it.group == 'org.graalvm.polyglot' } || versions.size() > 1) {
            throw new GradleException('Mehr als eine GraalJS-Linie im Klassenpfad der App: '
                    + graal.collect { "${it.group}:${it.name}:${it.version}" }.sort().join(', ')
                    + '. playwright4j und sein GraalVM-Stapel gehören nur in die Konfiguration playwrightDriver.')
        }
    }
}
tasks.named('check') {
    dependsOn graalLineCheck
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    // Der Treiber-Prozess der Chat-Websuche bekommt in Tests die JARs direkt aus der Konfiguration.
    def driverJars = configurations.playwrightDriver
    inputs.files(driverJars)
    doFirst {
        systemProperty 'playwright4j.driver.classpath', driverJars.files.join(File.pathSeparator)
    }
    // Der Bedienzustand (app-state.json) der Tests liegt im Build-Ordner, nie im Benutzerordner; jeder Lauf beginnt leer.
    def appState = layout.buildDirectory.file('tmp/test-app-state.json').get().asFile
    systemProperty 'space-harvester.app-state', appState.absolutePath
    doFirst { appState.delete() }
    // Die Systemfunktionen der Diagramm-Ansicht (system-functions.json) ebenso: nie die des Benutzers.
    def systemFunctions = layout.buildDirectory.file('tmp/test-system-functions.json').get().asFile
    systemProperty 'space-harvester.system-functions', systemFunctions.absolutePath
    doFirst { systemFunctions.delete() }
    // Die App-Tests rendern PDFs mit Systemschriften und bauen viele Swing-Oberflächen; 512 MB (Vorgabe) reichen nicht mehr.
    // Auch 1 GB reichte am 27.11.2026 nicht mehr: AttachmentViewerPanelTest rendert eine PDF-Seite bis zur Pixelgrenze
    // (40 Mio. Pixel, rund 160 MB) und lief nach den übrigen Tests derselben JVM in OutOfMemoryError (develop wechselnd rot).
    maxHeapSize = '2g'
    // Echttest des Chats mit Werkzeugen (ADR 0033) gegen einen Ollama-Server, nur auf Anfrage:
    // -PchatLiveOllama=http://localhost:11434 [-PchatLiveModel=gemma4:12b] [-PchatLiveNoToolsModel=qwen2.5-coder:1.5b-base]
    ['chatLiveOllama', 'chatLiveModel', 'chatLiveNoToolsModel'].each { name ->
        if (project.hasProperty(name)) {
            systemProperty "chat.live.${name.substring('chatLive'.length()).uncapitalize()}", project.property(name)
        }
    }
    // Fehlgeschlagene Tests mit Meldung im Konsolenprotokoll, damit CI-Fehler ohne Berichts-Download lesbar sind.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Startet das fertige JAR wie ein Benutzer (#103): --version und --screenshot mit einer Dateiquelle, ohne Bildschirm.
// Prüft, dass der Loader alle verschachtelten JARs findet und jeder Bereich ohne Fehler rendert.
def appJarCheck = tasks.register('appJarCheck') {
    group = 'verification'
    description = 'Startet das ausführbare App-JAR und rendert jeden Bereich als PNG.'
    def jar = tasks.named('bootJar').flatMap { it.archiveFile }
    def work = layout.buildDirectory.dir('app-jar-check')
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    inputs.file(jar)
    outputs.dir(work)
    doLast {
        def dir = work.get().asFile
        project.delete(dir)
        def files = new File(dir, 'handbuch')
        files.mkdirs()
        new File(files, 'betrieb.md').setText('# Betrieb\n\nNeustart mit systemctl.\n', 'UTF-8')
        def config = new File(dir, 'app.yml')
        // Terminal-Ausgabe „Alles“: Die Prüfung sucht Ausnahmen in der Ausgabe; ohne Angabe wäre das Terminal still.
        config.setText("""\
            logging:
              threshold:
                console: all
            space-harvester-app:
              data-directory: '${new File(dir, 'data').absolutePath.replace('\\', '/')}'
            space-harvester:
              sources:
                - id: handbuch
                  type: files
                  title: Betriebshandbuch
                  options:
                    directory: '${files.absolutePath.replace('\\', '/')}'
            """.stripIndent(), 'UTF-8')
        def java = launcher.get().executablePath.asFile.absolutePath
        def run = { List<String> args ->
            def out = new ByteArrayOutputStream()
            def result = project.providers.exec {
                commandLine([java, '-Djava.awt.headless=true', "-DSPACE_HARVESTER_LOG_DIR=${dir}/logs",
                             '-jar', jar.get().asFile.absolutePath] + args)
                ignoreExitValue = true
            }
            def text = result.standardOutput.asText.get() + result.standardError.asText.get()
            if (result.result.get().exitValue != 0) {
                throw new GradleException("App-JAR ${args} endete mit ${result.result.get().exitValue}:\n${text}")
            }
            return text
        }
        // Doppelklick mit Java 8: Main-Class ist der Launcher, als Java-8-Klassendatei (Version 52) in der obersten Ebene
        new java.util.jar.JarFile(jar.get().asFile).withCloseable { zip ->
            def mainClass = zip.manifest.mainAttributes.getValue('Main-Class')
            if (mainClass != launcherClass) {
                throw new GradleException("Main-Class ist ${mainClass}, erwartet ${launcherClass}")
            }
            ['Launcher', 'JavaRuntimeFinder'].each { name ->
                def entry = zip.getEntry("com/aresstack/spaceharvester/launcher/${name}.class")
                if (entry == null) {
                    throw new GradleException("${name}.class fehlt in der obersten Ebene des App-JARs")
                }
                def bytes = zip.getInputStream(entry).withCloseable { it.readNBytes(8) }
                int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${name}.class hat Klassendatei-Version ${major}, Java 8 braucht 52")
                }
            }
        }
        def version = run(['--version'])
        if (!version.contains('Space Harvester Desktop')) {
            throw new GradleException("--version gab keine Version aus:\n${version}")
        }
        def shots = new File(dir, 'screenshots')
        def log = run(['--config', config.absolutePath, '--screenshot', shots.absolutePath])
        def pngs = (shots.listFiles() ?: []).findAll { it.name.endsWith('.png') && it.length() > 0 }
        if (pngs.size() != 7) {
            throw new GradleException("Erwartet 7 Bildschirmfotos, gefunden ${pngs*.name}:\n${log}")
        }
        if (log.contains('Exception')) {
            throw new GradleException("Ausnahme beim Rendern:\n${log}")
        }
    }
}

tasks.named('check') {
    dependsOn appJarCheck
}
