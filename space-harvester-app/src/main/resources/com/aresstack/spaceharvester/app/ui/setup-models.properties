# Vorzugsmodelle für „Modelle“ (Einrichtungsassistent und Einstellungen), solange noch nichts gewählt ist; wie
# setup-models.properties des Enterprise AI Client. Reihenfolge: genau diese Kennung, sonst genau ein Modell, dessen
# Kennung den Teil nach dem letzten „/“ enthält, sonst das erste angebotene Modell. Fehlt das Vorzugsmodell, ist das
# kein Fehler. <art>.match ersetzt den Teil nach dem letzten „/“ durch Teilwörter (Komma-Liste), die alle in der
# Kennung vorkommen müssen.
chat=openai/gpt-oss-120b
embedding=danielheinz/e5-base-sts-en-de
# Vision und Rerank wählen nur vor, wenn der Dienst genau dieses Modell anbietet (Groß-/Kleinschreibung egal, auch ohne
# Anbieterteil vor „/“), sonst bleibt das Feld leer; ein eingetragenes Modell bleibt immer.
vision=google/gemma-4-31B-it
rerank=nvidia/llama-nemotron-rerank-1b-v2
