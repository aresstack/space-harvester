# Space Harvester Desktop – Konfiguration
#
# Dieselben Schlüssel wie der Dienst (space-harvester: …), dazu space-harvester-app: für die App.
# Geheimnisse nie hier eintragen; hier steht nur der Platzhalter ${NAME}. Den Wert gibt man im Quellen-Assistenten
# ein (Wissensquellen › Bearbeiten …): Die App legt ihn unter Windows verschlüsselt für das Benutzerkonto ab (DPAPI)
# und setzt ihn beim Start selbst. Eine Java-Property oder Umgebungsvariable gleichen Namens geht auch.

space-harvester-app:
  # Lokaler Bestand (Lucene), Aufträge und Analysen; Standard: <Benutzerordner>/.space-harvester/data
  data-directory: ${SPACE_HARVESTER_DATA:}

space-harvester:
  sources:
    - id: confluence
      type: confluence
      title: Confluence
      base-url: https://confluence.example.org     # ohne /rest
      auth:
        type: pat                                  # none | basic | pat
        token: ${CONFLUENCE_TOKEN}
      # mTLS, zusätzlich zur Anmeldung:
      # client-certificate:
      #   enabled: true
      #   type: windows-my                         # pkcs12 | windows-my
      #   thumbprint: ${CONFLUENCE_CLIENT_THUMBPRINT}
      # trust-bundle: windows                      # Windows-Zertifikatspeicher + Java, oder Name unter spring.ssl.bundle (unten)
    # - id: handbuch
    #   type: files
    #   title: Betriebshandbuch
    #   options:
    #     directory: C:/Daten/Handbuch
    #     include: "*.md, *.txt, *.pdf"

  network:
    # Ohne Angabe gilt unter Windows pac-url-powershell (PAC-Adresse der Interneteinstellungen per PowerShell),
    # sonst disabled. Der Assistent (Schritt "Proxy und Netzwerk") schreibt den Abschnitt bei Bedarf selbst.
    # proxy:
    #   mode: pac-url-powershell  # pac-url-powershell | pac-url-windows-settings | pac-url-wscript
    #                             # | windows-static-proxy | pac-url-manual | manual-proxy | disabled
    #   pac-url: http://proxy.example.org/proxy.pac   # nur bei pac-url-manual
    #   non-proxy-hosts: [localhost, "*.intern"]
    async-transport: web-client

# Eigene Zertifizierungsstellen (wie beim Dienst):
# spring:
#   ssl:
#     bundle:
#       pem:
#         firma:
#           truststore:
#             certificate: C:/Daten/firma-ca.pem
