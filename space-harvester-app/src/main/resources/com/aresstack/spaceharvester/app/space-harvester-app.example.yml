# Space Harvester Desktop – Konfiguration
#
# Dieselben Schlüssel wie der Dienst (space-harvester: …), dazu space-harvester-app: für die App.
# Geheimnisse nie hier eintragen, sondern als Umgebungsvariable referenzieren: ${NAME}. Fehlt eine Variable,
# fragt die App das Passwort bzw. Token beim Start ab und hält es nur bis zum Schließen im Speicher.
#
# Unter Windows Umgebungsvariablen z. B. setzen mit:  setx CONFLUENCE_TOKEN "…"   (danach App neu starten)

space-harvester-app:
  # Lokaler Bestand (Lucene), Aufträge und Analysen; Standard: <Benutzerordner>/.space-harvester/data
  data-directory: ${SPACE_HARVESTER_DATA:}

space-harvester:
  sources:
    - id: confluence
      type: confluence
      title: Confluence
      base-url: https://confluence.example.org     # ohne /rest
      auth:
        type: pat                                  # none | basic | pat
        token: ${CONFLUENCE_TOKEN}
      # mTLS, zusätzlich zur Anmeldung:
      # client-certificate:
      #   enabled: true
      #   type: windows-my                         # pkcs12 | windows-my
      #   thumbprint: ${CONFLUENCE_CLIENT_THUMBPRINT}
      # trust-bundle: firma                        # Name unter spring.ssl.bundle, siehe unten
    # - id: handbuch
    #   type: files
    #   title: Betriebshandbuch
    #   options:
    #     directory: C:/Daten/Handbuch
    #     include: "*.md, *.txt, *.pdf"

  network:
    proxy:
      mode: disabled            # disabled | manual-proxy | pac-url-manual | pac-url-windows-settings | …
      # pac-url: http://proxy.example.org/proxy.pac
    async-transport: web-client

# Eigene Zertifizierungsstellen (wie beim Dienst):
# spring:
#   ssl:
#     bundle:
#       pem:
#         firma:
#           truststore:
#             certificate: C:/Daten/firma-ca.pem
