# Space Harvester Desktop – Konfiguration
#
# Dieselben Schlüssel wie der Dienst (space-harvester: …), dazu space-harvester-app: für die App.
# Geheimnisse nie hier eintragen; hier steht nur der Platzhalter ${NAME}. Den Wert gibt man im Quellen-Assistenten
# ein (Wissensquellen › Bearbeiten …): Die App legt ihn unter Windows verschlüsselt für das Benutzerkonto ab (DPAPI)
# und setzt ihn beim Start selbst. Eine Java-Property oder Umgebungsvariable gleichen Namens geht auch.

space-harvester-app:
  # Lokaler Bestand (Lucene), Aufträge und Analysen; Standard: <Benutzerordner>/.space-harvester/data
  data-directory: ${SPACE_HARVESTER_DATA:}
  # Fläche hinter dem Bild in „Bilder der Seite“ (Einstellungen › Allgemein › Darstellung):
  # theme (Vorgabe, wie die App) | white | grey | dark | black
  # viewer:
  #   background: theme
  # Whisper-Modell für Spracheingabe und Video-Transkripte (Einstellungen › Modelle); wird nach Rückfrage einmal von
  # Hugging Face nach <Benutzerordner>/.space-harvester/models geladen:
  # tiny (Vorgabe) | base | small | medium | large-v3-turbo | large-v3
  # whisper:
  #   model: tiny
  # Export „Analytics“ (Export-Reiter): Zeitraum und die Pfade des Confluence-Analytics-Plugins. Ohne Angabe gelten die
  # Pfade der Analytics-Oberfläche von Confluence 10.2; einstellbar unter Einstellungen › Allgemein › Analytics-Export.
  # Platzhalter {spaceKey}, {from}, {to}; {nextPageToken} in der Seitenliste ist das Token der vorigen Antwort, der
  # Parameter davor (Vorgabe pageToken, wie die Oberfläche) kann je Instanz anders heißen (Entwicklerwerkzeuge › Netzwerk).
  # analytics:
  #   period: 365d
  #   details: "/rest/confanalytics/1.0/space/details?spaceKey={spaceKey}"
  #   activity-by-date: "/rest/confanalytics/1.0/space/activityByDate?spaceKey={spaceKey}&fromDate={from}&toDate={to}&type=total&period=week&timezone=UTC&content=page%2Cblog"
  #   content-views: "/rest/confanalytics/1.0/space/paginated/contentViews?spaceKey={spaceKey}&fromDate={from}&toDate={to}&type=total&period=week&timezone=UTC&content=page%2Cblog&sortField=VIEWED_COUNT&sortOrder=DESC&limit=100&pageToken={nextPageToken}"

space-harvester:
  sources:
    - id: confluence
      type: confluence
      title: Confluence
      base-url: https://confluence.example.org     # ohne /rest
      auth:
        type: pat                                  # none | basic | pat
        token: ${CONFLUENCE_TOKEN}
      # mTLS, zusätzlich zur Anmeldung:
      # client-certificate:
      #   enabled: true
      #   type: windows-my                         # pkcs12 | windows-my
      #   thumbprint: ${CONFLUENCE_CLIENT_THUMBPRINT}
      # trust-bundle: windows                      # Windows-Zertifikatspeicher + Java, oder Name unter spring.ssl.bundle (unten)
    # - id: handbuch
    #   type: files
    #   title: Betriebshandbuch
    #   options:
    #     directory: C:/Daten/Handbuch
    #     include: "*.md, *.txt, *.pdf"

  network:
    # Ohne Angabe gilt unter Windows pac-url-powershell (PAC-Adresse der Interneteinstellungen per PowerShell),
    # sonst disabled. Der Assistent (Schritt "Proxy und Netzwerk") schreibt den Abschnitt bei Bedarf selbst.
    # proxy:
    #   mode: pac-url-powershell  # pac-url-powershell | pac-url-windows-settings | pac-url-wscript
    #                             # | windows-static-proxy | pac-url-manual | manual-proxy | disabled
    #   pac-url: http://proxy.example.org/proxy.pac   # nur bei pac-url-manual
    #   non-proxy-hosts: [localhost, "*.intern"]
    async-transport: web-client

# Eigene Zertifizierungsstellen (wie beim Dienst):
# spring:
#   ssl:
#     bundle:
#       pem:
#         firma:
#           truststore:
#             certificate: C:/Daten/firma-ca.pem

# Terminal-Ausgabe (derselbe Schlüssel wie beim Dienst, Spring Boot): welche Meldungen im Terminal erscheinen, aus dem
# die App gestartet wurde: off | error | warn | info | all, ohne Angabe off. Die Protokolldatei unter
# <Benutzerordner>/.space-harvester/logs enthält immer alle Meldungen. Auch unter Einstellungen › Allgemein.
# logging:
#   threshold:
#     console: warn
